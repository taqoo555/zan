}

function pickRockPlan() {
  if (floorNo < CONFIG.ROCK_FROM) return null;
  const ch = chapterOf(floorNo);
  
  
  if (isBossFloor(floorNo)) return null;
  let on;
  if (ch === 2 || ch === 3) on = rockTutorialFloor(ch);            
  else on = floorRand(1091) < CONFIG.MIX_RATE;
  if (!on) return null;
  
  const fuji = (floorNo >= CONFIG.ROCK_FUJI_FROM && floorRand(3271) < CONFIG.ROCK_FUJI_RATE);
  return { art: rockArtOf(ch), place:'band', fuji };
}

function chapterFloorOrder(ch) {
  const base = (ch - 1) * 10 + 1;
  const key = f => { let h = Math.imul((f * 0x9e3779b1) ^ (ch * 0x85ebca6b), 0xc2b2ae35); h ^= h >>> 15; return h >>> 0; };
  const list = []; for (let i = 0; i < 9; i++) list.push(base + i);
  return list.sort((a, b) => key(a) - key(b));
}
function rockTutorialFloor(ch) {
  const l = chapterFloorOrder(ch);
  return l.indexOf(floorNo) >= 3;                    
}

function makePatches(plan, rnd) {
  floorPatches = [];
  floorCells = { water: new Map(), poison: new Map() };
  if (!plan) { return; }
  
  if (plan.water) { layoutPatches('water', plan.water, rnd, null); rebuildFloorCells(); }
  if (plan.poison) { layoutPatches('poison', plan.poison, rnd, floorCells.water); rebuildFloorCells(); }
}


function floorRand(salt) {
  let h = Math.imul((floorNo * 0x9e3779b1) ^ (salt * 0x85ebca6b), 0xc2b2ae35);
  h ^= h >>> 15; h = Math.imul(h, 0x27d4eb2f); h ^= h >>> 13;
  return (h >>> 0) / 4294967296;
}


function isTutorialFloor(ch) {
  const i = chapterFloorOrder(ch).indexOf(floorNo);
  return i >= 0 && (i <= 2 || i >= 6);
}

  if (forceTerrain !== null) {

    if (k === 'swamp' || k === 'poison') return { poison: pat || 'few' };
    if (k === 'water') return { water: pat || 'blob' };
    return null;
  }
  
  if (isBossFloor(floorNo)) {

    return null;

  if (floorRand(457) < CONFIG.MIX_RATE) plan.poison = pats[(floorRand(2731) * pats.length) | 0];
  return (plan.water || plan.poison) ? plan : null;
}

const SPARKLE_T = [0.32, 0.58, 0.84], SPARKLE_PH = [0, 2.4, 4.8];
function sparkleAlpha(i) {
  const a = (Math.sin(Date.now() / 210 + SPARKLE_PH[i]) + 1) / 2;
  return a < 0.6 ? 0 : (a - 0.6) / 0.4;
}
function drawSparkle(x, y, al) {
  const sx = Math.round(x), sy = Math.round(y);
  
  ctx.fillStyle = `rgba(28,18,4,${al * 0.8})`;
  ctx.fillRect(sx - 2, sy - 5, 4, 10); ctx.fillRect(sx - 5, sy - 2, 10, 4);
  ctx.fillStyle = `rgba(255,224,102,${al})`;
  ctx.fillRect(sx - 1, sy - 4, 2, 8); ctx.fillRect(sx - 4, sy - 1, 8, 2);

}

function drawSlash(s) {
  if (s.whip) {
    
    
    const pts = s.pts || whipPoints(s);
    const k = Math.min(1, s.t / s.whip.life);
    const al = (1 - k * 0.35);
    for (let i = 0; i < pts.length; i++) {
      const q = pts[i];
      const taper = Math.pow(1 - q.u, 0.75);
      const sz = Math.max(2, Math.round(s.whip.thick * (0.22 + 0.78 * taper)));
      const px = Math.round(q.x), py = Math.round(q.y);
      ctx.globalAlpha = al * (0.55 + 0.45 * q.u);
      if (sz >= 3) { ctx.fillStyle = WHIP_EDGE; ctx.fillRect(px - sz / 2 - 1, py - sz / 2 - 1, sz + 2, sz + 2); }
      ctx.fillStyle = WHIP_COLOR; ctx.fillRect(px - sz / 2, py - sz / 2, sz, sz);
      if (sz >= 3 && i % 2 === 0) { ctx.fillStyle = WHIP_THORN; ctx.fillRect(px, py - 1, 1, 1); }   
      if (q.u > 0.94) { ctx.fillStyle = '#ffffff'; ctx.fillRect(px - 1, py - 1, 3, 3); }             
      
      if (i % 4 === 2 && i + 1 < pts.length) {
        const nx = -(pts[i + 1].y - q.y), ny = (pts[i + 1].x - q.x), L = Math.hypot(nx, ny) || 1;
        const side = (i % 8 === 2) ? 1 : -1;
        ctx.fillStyle = WHIP_THORN;
        for (let t2 = 1; t2 <= 2; t2++) {
          const ts = 3 - t2, ox = nx / L * (1 + t2 * 2) * side, oy = ny / L * (1 + t2 * 2) * side;
          ctx.fillRect(Math.round(px + ox) - (ts >> 1), Math.round(py + oy) - (ts >> 1), ts, ts);
        }
      }
    }
    ctx.globalAlpha = 1;
    
    if (s.sparkle) {
      for (let si = 0; si < SPARKLE_T.length; si++) {
        const al = sparkleAlpha(si); if (al <= 0) continue;
        const q = pts[Math.min(pts.length - 1, Math.round((pts.length - 1) * SPARKLE_T[si]))];
        drawSparkle(q.x, q.y, al);
      }
    }
    return;
  }
  if (s.beam) {
    
    if (s.trail) for (let i = 0; i < s.trail.length; i++) {
      const t = s.trail[i], k = (i + 1) / s.trail.length;
      ctx.globalAlpha = k * 0.75;
      ctx.fillStyle = s.color;
      const sz = 4 + Math.round(k * 4);
      ctx.fillRect(Math.round(t.x) - sz / 2, Math.round(t.y) - sz / 2, sz, sz);
    }
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#03253f';
    ctx.fillRect(Math.round(s.x) - 8, Math.round(s.y) - 8, 16, 16);
    ctx.fillStyle = s.color;
    ctx.fillRect(Math.round(s.x) - 7, Math.round(s.y) - 7, 14, 14);
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(Math.round(s.x) - 3, Math.round(s.y) - 3, 6, 6);
    return;
  }
  
  const k = Math.min(1, s.t / 0.16);
  const a0 = s.a - s.arc / 2, a1 = s.a + s.arc / 2;
  const head = a0 + (a1 - a0) * Math.min(1, k * 1.35);
  const n = 20;
  const bands = s.heavy ? [0.5, 0.66, 0.82, 1.0] : [0.62, 0.82, 1.0];
  
  let cur = null;
  for (let bi = 0; bi < bands.length; bi++) {
    const r = s.reach * bands[bi];
    const sz = (bi === 1 ? 8 : 6) + (s.heavy ? 3 : 0);
    
    const base = (s.color2 && bi % 2 === 1) ? s.color2 : s.color;
    const last = bi === bands.length - 1;
    for (let i = 0; i < n; i++) {
      const t = i / (n - 1);
      const a = a0 + (head - a0) * t;
      ctx.globalAlpha = (0.20 + 0.80 * t) * (1 - k * 0.55) * 0.6;   
      const col = (last && t > 0.72) ? '#ffffff' : base;
      if (col !== cur) { ctx.fillStyle = col; cur = col; }
      ctx.fillRect(Math.round(s.x + Math.cos(a) * r) - sz / 2, Math.round(s.y + Math.sin(a) * r) - sz / 2, sz, sz);
    }
  }
  
  if (k < 0.92) {
    const bx = Math.cos(head), by = Math.sin(head);
    ctx.globalAlpha = Math.max(0, 1 - k * 0.5);
    const steps = 16;
    let cur2 = null;   
    for (let i = 0; i <= steps; i++) {
      const t = i / steps, rr = 10 + (s.reach - 10) * t;
      const sz = Math.max(3, Math.round((s.heavy ? 10 : 8) - 5 * t));
      const col = t > 0.78 ? '#ffffff' : (s.color2 && i % 2 === 1 ? s.color2 : s.color);
      if (col !== cur2) { ctx.fillStyle = col; cur2 = col; }
      ctx.fillRect(Math.round(s.x + bx * rr) - sz / 2, Math.round(s.y + by * rr) - sz / 2, sz, sz);
    }
    
    ctx.fillStyle = '#ffc94a';
    ctx.fillRect(Math.round(s.x + bx * 10) - 3, Math.round(s.y + by * 10) - 3, 6, 6);
    ctx.globalAlpha = 1;
    
    if (s.sparkle && s.reach >= 40) {
      for (let si = 0; si < SPARKLE_T.length; si++) {
        const al = sparkleAlpha(si); if (al <= 0) continue;
        const rr2 = 10 + (s.reach - 10) * SPARKLE_T[si];
        drawSparkle(s.x + bx * rr2, s.y + by * rr2, al);
      }
    }
  }
  ctx.globalAlpha = 1;
}

function miniArc(cx, cy, r, sz, bands, color, a0, a1, alpha) {
  const n = 12;
  for (let b = 0; b < bands; b++) {
    for (let i = 0; i < n; i++) {
      const t = i / (n - 1), a = a0 + (a1 - a0) * t;
      ctx.globalAlpha = alpha * (0.35 + 0.65 * t);
      ctx.fillStyle = (t > 0.8 && b === 0) ? '#ffffff' : color;
      const rr = r - b * sz * 0.8;
      ctx.fillRect(Math.round(cx + Math.cos(a) * rr) - sz / 2, Math.round(cy + Math.sin(a) * rr) - sz / 2, sz, sz);
    }
  }
  ctx.globalAlpha = 1;
}

function drawAngryMark(cx, cy, s) {
  const u = Math.max(2, Math.round(s / 4.5));
  const parts = [[-1, -4.5, 1, -1.2], [1, -4.5, 3.2, -2.5]];   
  const rot = (x, y, k) => k === 0 ? [x, y] : k === 1 ? [-y, x] : k === 2 ? [-x, -y] : [y, -x];
  for (let pass = 0; pass < 2; pass++) {
    ctx.fillStyle = pass === 0 ? '#7a1409' : '#ff3c28';
    const pad = pass === 0 ? 2 : 0;
    for (let k = 0; k < 4; k++) for (const [x0, y0, x1, y1] of parts) {
      const a = rot(x0, y0, k), b = rot(x1, y1, k);
      ctx.fillRect(Math.round(cx + Math.min(a[0], b[0]) * u) - pad, Math.round(cy + Math.min(a[1], b[1]) * u) - pad,
                   Math.round(Math.abs(b[0] - a[0]) * u) + pad * 2, Math.round(Math.abs(b[1] - a[1]) * u) + pad * 2);
    }
  }
}

function drawKasaShield(cx, cy, face, sh, rr, broken, big) {
  const w = big ? 9 : 4.5;           
  const ribN = big ? 6 : 4;          
  const outer = rr + w, inner = rr - w;
  const edge = broken ? 'rgba(255,224,102,0.95)' : 'rgba(120,60,26,0.85)';
  const cloth = broken ? 'rgba(120,90,40,0.30)' : 'rgba(224,140,84,0.55)';
  const rim = broken ? 'rgba(255,224,102,0.95)' : 'rgba(247,232,208,0.9)';
  ctx.save();
  
  ctx.beginPath();
  ctx.arc(cx, cy, outer, face - sh, face + sh);
  ctx.arc(cx, cy, inner, face + sh, face - sh, true);
  ctx.closePath();
  ctx.fillStyle = cloth; ctx.fill();
  
  ctx.strokeStyle = rim; ctx.lineWidth = big ? 3 : 2;
  ctx.beginPath(); ctx.arc(cx, cy, outer, face - sh, face + sh); ctx.stroke();
  
  ctx.strokeStyle = edge; ctx.lineWidth = big ? 2 : 1.5;
  ctx.beginPath(); ctx.arc(cx, cy, inner, face - sh, face + sh);
  
  for (let i = 0; i <= ribN; i++) {
    const a = face - sh + (2 * sh) * (i / ribN);
    ctx.moveTo(cx + Math.cos(a) * inner, cy + Math.sin(a) * inner);
    ctx.lineTo(cx + Math.cos(a) * outer, cy + Math.sin(a) * outer);
  }
  ctx.stroke();
  ctx.restore();
}

      const tid = c.id;
      if (SWORDS[tid]) for (let k = 0; k < SWORD_MAX_LV; k++) {
        ctx.fillStyle = k < swLv(tid) ? '#ffe066' : 'rgba(255,255,255,0.25)';
        ctx.fillRect(r.x + 158 + k * 8, r.y + 62, 6, 6);
      }
    }
    ctx.textAlign = 'center';
  }
  ctx.globalAlpha = 1;
  ctx.restore();
}


function fmtTime(t) {
  const m = Math.floor(t / 60), s = Math.floor(t % 60);
  return m + ':' + (s < 10 ? '0' : '') + s;
}
function topSword() {
  let id = null;
  for (const k of SWORD_ORDER) if (unlocked(k) && (id === null || swLv(k) > swLv(id))) id = k;
  return id;
}
function drawResult(reached, y0) {
  ctx.textAlign = 'center';
  
  ctx.fillStyle = '#ffe066'; ctx.font = `bold ${fp(54)}px ui-monospace, Menlo, monospace`;
  ctx.fillText(String(reached), W / 2, y0 + 12);
  ctx.fillStyle = '#8a93a8'; ctx.font = `bold ${fp(13)}px ui-monospace, Menlo, monospace`;
  ctx.fillText('BEST  ' + best, W / 2, y0 + 50);

  
  const KINDS = [
    { kind:'oni',    art:'oni' },
    { kind:'tama',   art:'tama' },
    { kind:'dasher', art:'dasher' },
    { kind:'kasa',   art:'kasa' },
  ];
  const yKill = y0 + 88, colW = 76;
  let kx = W / 2 - (KINDS.length - 1) * colW / 2;
  for (const c of KINDS) {
    const ic = ART[c.art];
    if (ic) ctx.drawImage(ic, kx - 26, yKill - 11, 22, 22);
    ctx.textAlign = 'left';
    ctx.fillStyle = '#cfd6e6'; ctx.font = `bold ${fp(17)}px ui-monospace, Menlo, monospace`;
    ctx.fillText(String(runKillsBy[c.kind] || 0), kx - 1, yKill + 6);
    ctx.textAlign = 'center';
    kx += colW;
  }

  
  const yT = y0 + 126;
  ctx.fillStyle = '#6b7488';
  ctx.fillRect(W / 2 - 44, yT - 10, 14, 3); ctx.fillRect(W / 2 - 44, yT + 7, 14, 3);
  ctx.fillStyle = '#cfd6e6';
  for (let k = 0; k < 5; k++) ctx.fillRect(W / 2 - 39 + k, yT - 6 + k, 4 - Math.min(3, k), 3);
  for (let k = 0; k < 5; k++) ctx.fillRect(W / 2 - 39 + k, yT + 6 - k, 4 - Math.min(3, k), 3);
  ctx.textAlign = 'left';
  ctx.fillStyle = '#cfd6e6'; ctx.font = `bold ${fp(17)}px ui-monospace, Menlo, monospace`;
  ctx.fillText(fmtTime(runTime), W / 2 - 18, yT + 6);
  ctx.textAlign = 'center';

  
  
  const ids = Object.keys(took).filter(id => id !== 'unlock' && (CARDS.some(z => z.id === id) || CHAPTER_CARDS.some(z => z.id === id)));
  const PER = 7, STEP = 38;
  for (let row = 0; row * PER < ids.length; row++) {
    const line = ids.slice(row * PER, row * PER + PER);
    const yc = y0 + 160 + row * 46;
    let x = W / 2 - (line.length - 1) * STEP / 2;
    for (const id of line) {
      const c = CARDS.find(z => z.id === id) || CHAPTER_CARDS.find(z => z.id === id);
      {
        const ic = ART[c.icon];
        if (ic) ctx.drawImage(ic, x - 14, yc, 28, 28);
      }
      ctx.fillStyle = '#cfd6e6'; ctx.font = `bold ${fp(12)}px ui-monospace, Menlo, monospace`;
      ctx.fillText(String(took[id]), x, yc + 42);
      x += STEP;
    }
  }
}
function drawOver() {
  ctx.fillStyle = `rgba(8,9,14,${Math.min(0.90, overT * 1.6)})`; ctx.fillRect(0, CONFIG.TOP, W, CONFIG.BAR_Y - CONFIG.TOP);
  ctx.textAlign = 'center';
  ctx.fillStyle = '#ff5a5a'; ctx.font = `bold ${fp(34)}px ui-monospace, Menlo, monospace`;
  ctx.fillText('GAME OVER', W / 2, 196);
  drawResult(floorNo - 1, 268);
  if (overT > 1.0) {
    const a = 0.4 + Math.sin(Date.now() / 300) * 0.3;
    ctx.fillStyle = `rgba(255,255,255,${a})`; ctx.font = `bold ${fp(13)}px ui-monospace, Menlo, monospace`;
    ctx.fillText('TAP', W / 2, 548);
  }
}

function drawClear() {
  ctx.fillStyle = `rgba(10,8,4,${Math.min(0.92, overT * 1.2)})`; ctx.fillRect(0, CONFIG.TOP, W, CONFIG.BAR_Y - CONFIG.TOP);
  const k = Math.min(1, overT / 0.9);
  ctx.save();
  ctx.translate(W / 2, 168);
  ctx.scale(0.6 + k * 0.4, 0.6 + k * 0.4);
  ctx.textAlign = 'center';
  ctx.shadowColor = '#ffe066'; ctx.shadowBlur = 24;
  ctx.fillStyle = '#ffe066';
  
  ctx.font = `bold ${fp(60)}px ui-monospace, Menlo, monospace`;
  ctx.globalAlpha = k;
  ctx.fillText('CLEAR', 0, 20);
  ctx.restore();
  ctx.globalAlpha = 1;
  if (overT > 0.8) {
    ctx.textAlign = 'center';
    ctx.fillStyle = '#cfd6e6'; ctx.font = `bold ${fp(13)}px ui-monospace, Menlo, monospace`;
    ctx.fillText('100F', W / 2, 246);
    drawResult(CONFIG.FINAL_FLOOR, 280);
    
    ctx.textAlign = 'center';
    ctx.fillStyle = '#ffe066'; ctx.font = `bold ${fp(15)}px ui-monospace, Menlo, monospace`;
    ctx.fillText('RUN  ' + runs, W / 2, 446);
  }
  if (overT > 1.6) {
    const a = 0.4 + Math.sin(Date.now() / 300) * 0.3;
    ctx.textAlign = 'center';
    ctx.fillStyle = `rgba(255,255,255,${a})`; ctx.font = `bold ${fp(13)}px ui-monospace, Menlo, monospace`;
    ctx.fillText('TAP', W / 2, 548);
  }
}


let last = 0;
function frame(t) {
  const raw = Math.min(0.05, (t - last) / 1000 || 0);
  last = t;
  
  if (dprCap > 1.25 && state === 'play' && !paused && raw > 0) {
    if (raw > 0.022) slowFrames++; else slowFrames = Math.max(0, slowFrames - 1);
    if (slowFrames > 45) { dprCap = dprCap > 1.5 ? 1.5 : 1.25; slowFrames = 0; resize(); }
  }
  
  const dt = raw * (slow > 0 ? 0.32 : 1);
  if (!paused) update(dt);
  if (!paused) bgmTick();
  shake = Math.max(0, shake - raw * 45);
  flash = Math.max(0, flash - raw * 1.6);
  slow = Math.max(0, slow - raw);
  freeze = Math.max(0, freeze - raw);
  oneUp = Math.max(0, oneUp - raw);
  goT = Math.max(0, goT - raw);
  if (state === 'choose') chooseT += raw;   
  
  if (vHold && (state !== 'title' || Date.now() - vHold > 1500)) { resetAsk = state === 'title'; vHold = 0; }
  clearT = Math.max(0, clearT - raw);
  if (clearT > 0) zoom += (CONFIG.CLEAR.zoom - zoom) * Math.min(1, raw * 10);   
  else zoom += (0 - zoom) * Math.min(1, raw * 4);
  bossIn = Math.max(0, bossIn - raw);
  bossDie = Math.max(0, bossDie - raw);
  chapterFlash = Math.max(0, chapterFlash - raw);
  if (state === 'over' || state === 'clear') overT += dt;
  draw();
  requestAnimationFrame(frame);
}

prepareArt();
resize();
requestAnimationFrame(frame);
</script>
