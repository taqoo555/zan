const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = 360, H = 640;
let scale = 1, offX = 0, offY = 0;

const MIN_TEXT_PX = 11;
function fp(n) { return Math.round(Math.max(n, MIN_TEXT_PX / Math.max(scale, 0.01)) * 10) / 10; }


let dprCap = 2, slowFrames = 0;
function resize() {
  const vw = window.innerWidth, vh = window.innerHeight;
  scale = Math.min(vw / W, vh / H);
  const dpr = Math.min(window.devicePixelRatio || 1, dprCap);   
  canvas.style.width  = vw + 'px';
  canvas.style.height = vh + 'px';
  canvas.width  = Math.round(vw * dpr);
  canvas.height = Math.round(vh * dpr);
  offX = (vw - W * scale) / 2;
  offY = (vh - H * scale) / 2;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.imageSmoothingEnabled = false;
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 120));

function toWorld(cx, cy) {
  const r = canvas.getBoundingClientRect();
  return { x: (cx - r.left - offX) / scale, y: (cy - r.top - offY) / scale };
}


function bake(def, s, whiteOut) {
  const h = def.px.length, w = def.px[0].length;
  const c = document.createElement('canvas');
  c.width = w * s; c.height = h * s;
  const g = c.getContext('2d');
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const ch = def.px[y][x];
      if (ch === '.') continue;
      g.fillStyle = whiteOut === true ? '#ffffff' : (typeof whiteOut === 'string' ? whiteOut : def.pal[ch]);
      g.fillRect(x * s, y * s, s, s);
    }
  }
  return c;
}

function fuseSprite(kinds) {
  const names = kinds.map(k => k === 'oni' ? 'oni_boss' : k + '_boss');
  if (names.length === 1) return SPRITES[names[0]];
  const KEYS = 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ';
  const h = SPRITES[names[0]].px.length;
  const pal = {}; const px = []; let n = 0;
  const maps = names.map(nm => {
    const m = {};
    for (const c in SPRITES[nm].pal) { const key = KEYS[n++]; m[c] = key; pal[key] = SPRITES[nm].pal[c]; }
    return m;
  });
  for (let y = 0; y < h; y++) {
    const i = Math.min(names.length - 1, Math.floor(y / h * names.length));
    const row = SPRITES[names[i]].px[y], m = maps[i];
    let out = '';
    for (const ch of row) out += (ch === '.' ? '.' : (m[ch] || ch));
    px.push(out);
  }
  return { pal, px };
}

function tone(freq, dur, type, vol) {
  if (!audio || muted || CONFIG.VOLUME <= 0) return;

  osc.frequency.setValueAtTime(freq, t0);
  gain.gain.setValueAtTime(0, t0);
  gain.gain.linearRampToValueAtTime(CONFIG.VOLUME * (vol == null ? 1 : vol), t0 + 0.008);
  gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  osc.connect(gain).connect(audio.destination);

}
function noise(dur, cut, vol) {
  if (!audio || muted || CONFIG.VOLUME <= 0) return;
  const n = Math.floor(audio.sampleRate * dur);
  const buf = audio.createBuffer(1, n, audio.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
  const src = audio.createBufferSource(); src.buffer = buf;
  const lp = audio.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = cut || 1200;
  const g = audio.createGain(); g.gain.value = CONFIG.VOLUME * (vol == null ? 1 : vol);
  src.connect(lp).connect(g).connect(audio.destination);
  src.start();
}

const BGM_SCALE = [0, 1, 5, 7, 8];      
const BGM_ROOT = 174.61;                 

function bgmFreq(v, bass) {
  const idx = v % 5, oct = Math.floor(v / 5);
  const root = bass ? BGM_ROOT / 2 : BGM_ROOT;
  return root * Math.pow(2, oct) * Math.pow(2, BGM_SCALE[idx] / 12);
}
function toneAt(freq, dur, type, vol, when) {
  if (!audio || muted || CONFIG.VOLUME <= 0) return;
  const osc = audio.createOscillator(), gain = audio.createGain();
  osc.type = type || 'triangle';
  osc.frequency.setValueAtTime(freq, when);
  gain.gain.setValueAtTime(0, when);
  gain.gain.linearRampToValueAtTime(CONFIG.VOLUME * (vol == null ? 1 : vol), when + 0.012);
  gain.gain.exponentialRampToValueAtTime(0.0001, when + dur);
  osc.connect(gain).connect(audio.destination);
  osc.start(when); osc.stop(when + dur + 0.02);
}

const BGM_BASS = [0,-1,-1,-1, 2,-1,-1,-1, 0,-1,-1,-1, 3,-1,2,-1];
const BGM_LEAD = [
  [7,-1,5,-1, 7,-1,9,-1, 5,-1,-1,-1, 7,5,-1,-1],    
  [5,7,-1,9, -1,7,-1,5, 9,-1,7,-1, -1,5,-1,-1],      
  [9,-1,-1,7, 5,-1,9,-1, -1,7,-1,5, -1,-1,7,-1],     
];
let bgmOn = false, bgmNextTime = 0, bgmStepI = 0;
function startBgm() { bgmOn = true; bgmNextTime = 0; bgmStepI = 0; }
function stopBgm()  { bgmOn = false; }
function bgmTick() {
  if (!bgmOn || !audio) return;
  const now = audio.currentTime;
  if (bgmNextTime < now) bgmNextTime = now + 0.05;   
  const bpm = 96 + Math.min(24, (chapter - 1) * 2.5);   
  const stepDur = 60 / bpm / 2;
  const lead = BGM_LEAD[(chapter - 1) % 3];
  while (bgmNextTime < now + 0.2) {
    const b = BGM_BASS[bgmStepI % 16];
    if (b >= 0) toneAt(bgmFreq(b, true), stepDur * 0.9, 'triangle', 0.16, bgmNextTime);
    const l = lead[bgmStepI % 16];
    if (l >= 0) toneAt(bgmFreq(l, false), stepDur * 0.85, 'square', 0.09, bgmNextTime);
    bgmNextTime += stepDur;
    bgmStepI++;
  }
}

      for (let r = 0; r < rows; r++) {
        const kind = ks[r % ks.length];
        const y = FTOP() + 30 + r * 52;
        for (let i = 0; i < per && out.length < n; i++)
          out.push({ kind, x: 50 + (W - 100) * (i / Math.max(1, per - 1)) + jit(14), y: y + jit(10) });
      }
      return out;
    } },
  
  { id:'wedge', w:2, from:8, make(n, pick) {
      const cx = W / 2 + jit(70), by = FBOT() - 20, out = [];
      for (let i = 0; i < n; i++) { const side = i % 2 ? 1 : -1, step = (i / 2 | 0);
        out.push({ kind: pick(), x: cx + side * step * 34 + jit(12), y: by - step * 30 + jit(10) }); }
      return out;
    } },
  
  { id:'ring', w:1.5, from:14, make(n, pick) {
      const cx = W / 2, cy = FMID(), rr = 105 + Math.random() * 25, out = [];
      for (let i = 0; i < n; i++) { const a = i / n * Math.PI * 2;
        out.push({ kind: pick(), x: cx + Math.cos(a) * rr + jit(14), y: cy + Math.sin(a) * rr * 0.85 + jit(14) }); }
      return out;
    } },
  
  { id:'guard', w:2, from:12, make(n, pick, pat) {
      const ks = Object.keys(pat.mix);
      const front = ks.filter(k => k === 'oni' || k === 'kasa'), back = ks.filter(k => k === 'tama' || k === 'dasher');
      if (!front.length || !back.length) return FORMS[0].make(n, pick, pat);   
      const nb = Math.max(2, Math.round(n * 0.4)), nf = n - nb, out = [];
      for (let i = 0; i < nb; i++) out.push({ kind: back[i % back.length],  x: 60 + (W - 120) * (i / Math.max(1, nb - 1)) + jit(16), y: FTOP() + 20 + jit(16) });
      for (let i = 0; i < nf; i++) out.push({ kind: front[i % front.length], x: 50 + (W - 100) * (i / Math.max(1, nf - 1)) + jit(16), y: FTOP() + 110 + jit(16) });
      return out;
    } },
  
  { id:'split', w:1.5, from:10, make(n, pick) {
      const out = [], cy = FMID() - 30;
      for (let i = 0; i < n; i++) { const left = i % 2 === 0;
        out.push({ kind: pick(), x: (left ? 78 : W - 78) + jit(70), y: cy + jit(180) }); }
      return out;
    } },
  
  { id:'biased', w:2, from:6, make(n, pick) {
      const left = Math.random() < 0.5, out = [];
      for (let i = 0; i < n; i++)
        out.push({ kind: pick(), x: (left ? 34 + Math.random() * 96 : W - 34 - Math.random() * 96), y: FTOP() + Math.random() * (FBOT() - FTOP()) });
      return out;
    } },
];

function mkEnemy(kind, x, y, hpMul, spdMul) {

    kind, x, y, hp: base.hp * hpMul, maxHp: base.hp * hpMul,
    speed: base.speed * spdMul, touch: base.touch, r: base.r,
    flash: 0, t: Math.random() * 6, fireT: 1.2 + Math.random() * CONFIG.FIRE.interval,
    kb: { x: 0, y: 0 },
    face: -Math.PI / 2, stagger: 0,

    burn: 0, burnTick: 0, burnDmg: 0,

  };
}

function buildFloor() {

             face: Math.PI / 2, stagger: 0, shotT: 1.2, ringT: CONFIG.BOSS_TAMA.ringEvery, rep: 0,
             
             bombT: CONFIG.BOSS_KASA.bombEvery,
             dx: 0, dy: 0, kb: { x:0, y:0 }, angry: false };
    return;
  }

  
  
  
  const TUTORIAL = [
    null,
    { id:'t1-oni',      mix:{ oni:1 },                              cnt:1.15 },  
    { id:'t2-tama',     mix:{ tama:1 },                             cnt:0.7  },  
    { id:'t3-dasher',   mix:{ dasher:1 },                           cnt:0.6  },  
    
    { id:'t4-kasa',     mix:{ kasa:1 },                             n:3      },  
    { id:'t5-oni-tama', mix:{ oni:0.5, tama:0.5 },                  cnt:1.0  },  
    { id:'t6-tama-dash',mix:{ tama:0.5, dasher:0.5 },               cnt:0.7  },  
  ];
  
  const TUTORIAL_MIX3 = { id:'t7-mix3', mix:{ oni:1/3, tama:1/3, dasher:1/3 }, cnt:1.0 };
  
  const KASA_FLOOR = { id:'f11-kasa', mix:{ kasa:1 }, cnt:0.55 };

  const patterns = [
    
    
    { id:'mix',    w:5,   mix:{ oni:0.25, tama:0.25, kasa:0.25, dasher:0.25 }, cnt:1.0, from:3, vary:true },
    
    
    { id:'oni',    w:2,   mix:{ oni:1 },                                        cnt:0.8,  from:1 },
    { id:'ghost',  w:2,   mix:{ tama:1 },                                       cnt:0.7,  from:4 },
    { id:'dasher', w:2,   mix:{ dasher:1 },                                     cnt:0.6,  from:5 },
    
    
  ];
  
  
  let pat;
  if (floorNo <= 6 && TUTORIAL[floorNo]) {
    pat = TUTORIAL[floorNo];
  } else if (floorNo <= 9) {
    pat = TUTORIAL_MIX3;
  } else if (floorNo === CONFIG.FLOORS_PER_CHAPTER + 1) {
    pat = KASA_FLOOR;                 
  } else {
    const avail = patterns.filter(pt => floorNo >= pt.from && (pt.to == null || floorNo <= pt.to));
    const wsum = avail.reduce((a, pt) => a + pt.w, 0);
    let r0 = Math.random() * wsum; pat = avail[0];
    for (const pt of avail) { r0 -= pt.w; if (r0 <= 0) { pat = pt; break; } }

  floorPattern = pat.id;

  
  const n = pat.n != null ? pat.n
    : Math.min(CONFIG.ENEMY_MAX, Math.round((CONFIG.ENEMY_BASE + fic * CONFIG.ENEMY_PER_FLOOR + (chapter - 1) * CONFIG.ENEMY_PER_CHAPTER) * pat.cnt));

  
  const forms = FORMS.filter(fm => floorNo >= fm.from);

  let r1 = Math.random() * fsum, form = forms[0];
  for (const fm of forms) { r1 -= fm.w; if (r1 <= 0) { form = fm; break; } }
  floorForm = form.id;

  
  const MIX_SHARES = [0.40, 0.30, 0.20, 0.10];
  let mix = pat.mix;
  if (pat.vary) {
    const ks = Object.keys(pat.mix).slice();
    for (let i = ks.length - 1; i > 0; i--) {          
      const j = Math.floor(floorRand(6100 + i * 31) * (i + 1));
      const t = ks[i]; ks[i] = ks[j]; ks[j] = t;
    }
    mix = {};
    ks.forEach((k, i) => { mix[k] = MIX_SHARES[i]; });
  }
  const kinds = Object.keys(mix);
  const pickKind = () => { let r = Math.random(), k0 = kinds[0];

  const slots = form.make(n, pickKind, pat.vary ? Object.assign({}, pat, { mix }) : pat);

  for (const sl of slots) {
    let x = Math.max(30, Math.min(W - 30, sl.x));
    let y = Math.max(FLOOR_TOP() + 24, Math.min(CONFIG.BAR_Y - 110, sl.y));
    
    const ddx = x - W / 2, ddy = y - CONFIG.START_Y, dd = Math.hypot(ddx, ddy);
    if (dd < 130) { const ang = dd < 0.01 ? -Math.PI / 2 : Math.atan2(ddy, ddx);
      x = Math.max(30, Math.min(W - 30, W / 2 + Math.cos(ang) * 130));
      y = Math.max(FLOOR_TOP() + 24, Math.min(CONFIG.BAR_Y - 130, CONFIG.START_Y + Math.sin(ang) * 130)); }
    const e = mkEnemy(sl.kind, x, y, hpMul, spdMul);
    nudgeOffRock(e);                 
    enemies.push(e);
  }
}

function nudgeOffRock(o) {
  if (!floorCells.rock.size || !hitsRock(o.x, o.y, o.r)) return;
  for (let r = 8; r <= 120; r += 8) {
    for (let k = 0; k < 12; k++) {
      const a = k / 12 * Math.PI * 2;
      const nx = Math.max(24, Math.min(W - 24, o.x + Math.cos(a) * r));
      const ny = Math.max(FLOOR_TOP() + 12, Math.min(CONFIG.BAR_Y - 30, o.y + Math.sin(a) * r));
      if (!hitsRock(nx, ny, o.r)) { o.x = nx; o.y = ny; return; }
    }
  }
}

function inRect(p, r) { return p.x > r.x && p.x < r.x + r.w && p.y > r.y && p.y < r.y + r.h; }

canvas.addEventListener('pointerdown', e => {
  e.preventDefault();
  initAudio();
  if (audio && audio.state === 'suspended') audio.resume();
  const p = toWorld(e.clientX, e.clientY);

  if (state === 'title') {
    
    if (resetAsk) {
      if (inRect(p, resetYesRect())) { eraseRecords(); resetAsk = false; }
      else resetAsk = false;                      
      return;
    }
    if (inRect(p, versionRect())) { vHold = Date.now(); return; }   
    if (inRect(p, startRect())) newRun();
    return;
  }
  if (inRect(p, muteRect()))  { muted = !muted; return; }
  
  if (state === 'play' && paused) { resumeGame(); return; }
  if (state === 'play' && inRect(p, pauseRect())) { paused = true; autoPaused = false; return; }
  
  if (state === 'play' || state === 'choose') {
    for (let i = 0; i < SWORD_ORDER.length; i++) if (inRect(p, swordRect(i))) { if (unlocked(SWORD_ORDER[i])) equipSword(SWORD_ORDER[i], state === 'play'); return; }
  }
  if (state === 'choose') { pickCard(p); return; }
  if (state === 'over')   { if (overT > 1.0) state = 'title'; return; }
  if (state === 'clear')  { if (overT > 1.6) state = 'title'; return; }

  dragging = true;
  dragOff.x = player.x - p.x; dragOff.y = player.y - p.y;
  target = { x: player.x, y: player.y };
  tapStart = state === 'play' ? { x: p.x, y: p.y, t: performance.now() } : null;
}, { passive:false });

canvas.addEventListener('pointermove', e => {
  if (!dragging || state !== 'play') return;
  e.preventDefault();
  const p = toWorld(e.clientX, e.clientY);
  target = { x: p.x + dragOff.x, y: p.y + dragOff.y };
  if (hintT > 0) hintT = 0;
}, { passive:false });

canvas.addEventListener('pointerup', e => {
  vHold = 0;                       
  const ts = tapStart; tapStart = null;
  dragging = false; target = null;
  
  if (ts && state === 'play' && player.sword.thunder) {
    const T = player.sword.thunder, p = toWorld(e.clientX, e.clientY);
    if (performance.now() - ts.t <= T.tapMs && Math.hypot(p.x - ts.x, p.y - ts.y) <= T.tapPx) thunderFire(ts.x, ts.y);
  }
});
['pointercancel','pointerleave'].forEach(ev =>

function cycleSword(dir) {
  const cur = SWORD_ORDER.indexOf(player.sword.id);
  for (let i = 1; i <= SWORD_ORDER.length; i++) {
    const id = SWORD_ORDER[((cur + dir * i) % SWORD_ORDER.length + SWORD_ORDER.length) % SWORD_ORDER.length];

function keyConfirm() {
  if (state === 'title') { newRun(); return; }
  if (state === 'play' && paused) { resumeGame(); return; }
  if (state === 'play') {
    if (thunderReady()) { const L = bestLine(null, thunderWidth()); if (L.pt) thunderFire(L.pt.x, L.pt.y); }
    return;
  }
  if (state === 'over'  && overT > 1.0) state = 'title';

}

const KEY_BY_POS = { KeyW: 'w', KeyA: 'a', KeyS: 's', KeyD: 'd', KeyQ: 'q', KeyE: 'e' };
const keyOf = e => KEY_BY_POS[e.code] || e.key.toLowerCase();
window.addEventListener('keydown', e => {
  const k = keyOf(e);
  if ([' ','enter','arrowup','arrowdown','arrowleft','arrowright'].includes(k)) e.preventDefault();
  keys[k] = true;
  if (e.repeat) return;              
  initAudio();                       
  if (audio && audio.state === 'suspended') audio.resume();
  if (k === ' ' || k === 'enter') { keyConfirm(); return; }
  if (state === 'choose' && ['1','2','3'].includes(k)) { choose(cards[+k - 1]); return; }
  if (state === 'play' && ['1','2','3','4'].includes(k)) {
    const id = SWORD_ORDER[+k - 1];
    if (id && unlocked(id)) equipSword(id, true);

  }
  if (k === 'q') { cycleSword(-1); return; }
  if (k === 'e') { cycleSword(1); return; }
  if (k === 'p') { if (paused) resumeGame(); else { paused = true; autoPaused = false; } }
  if (k === 'm') muted = !muted;
});

let autoPaused = false;
function pauseByLeaving() {
  if (state === 'play' && !paused) { paused = true; autoPaused = true; }
  if (audio) audio.suspend();
}

}

function alive() { return enemies.length + (boss ? 1 : 0); }


function onLine(px, py, r, sx, sy, pt, width) {
  const vx = pt.x - sx, vy = pt.y - sy, L2 = vx*vx + vy*vy || 1;
  let t = ((px - sx) * vx + (py - sy) * vy) / L2;
  t = Math.max(0, Math.min(1, t));
  return Math.hypot(px - (sx + vx*t), py - (sy + vy*t)) < width / 2 + r;
}

function lineEnd(ang, len) {
  const sx = player.x, sy = player.y;
  const cx = Math.cos(ang), cy = Math.sin(ang);
  let tmax = len == null ? 1e9 : len;
  if (cx > 0) tmax = Math.min(tmax, (W - 22 - sx) / cx);
  if (cx < 0) tmax = Math.min(tmax, (22 - sx) / cx);
  if (cy > 0) tmax = Math.min(tmax, (CONFIG.BAR_Y - 24 - sy) / cy);
  if (cy < 0) tmax = Math.min(tmax, (FLOOR_TOP() + 2 - sy) / cy);
  return { x: sx + cx * tmax, y: sy + cy * tmax };
}
function lineCuts(pt, width) {
  const sx = player.x, sy = player.y;
  let cuts = 0;
  for (const e of enemies) if (onLine(e.x, e.y, e.r, sx, sy, pt, width)) cuts++;
  if (boss && onLine(boss.x, boss.y, boss.r, sx, sy, pt, width)) cuts += 2;
  return cuts;
}
function bestLine(len, width) {
  let best = null, bestScore = -1e9, bestCuts = 0, bestAng = 0;
  for (let i = 0; i < 24; i++) {
    const ang = i * Math.PI / 12, raw = lineEnd(ang, len);
    
    const pt = clipRockLine(player.x, player.y, raw.x, raw.y, CONFIG.PLAYER_R);
    const cuts = lineCuts(pt, width);
    let near = 1e9;
    for (const e of enemies) near = Math.min(near, Math.hypot(e.x - pt.x, e.y - pt.y));
    if (boss) near = Math.min(near, Math.hypot(boss.x - pt.x, boss.y - pt.y) - boss.r);
    const score = cuts * 1000 + Math.min(near, 150);
    if (score > bestScore) { bestScore = score; best = pt; bestCuts = cuts; bestAng = ang; }
  }
  return { pt: best, cuts: bestCuts, ang: bestAng };
}



function zapFx(e) {
  rings.push({ x: e.x, y: e.y, r: 30, t: 0, life: 0.28, tele: false, white: true });
  for (let k = 0; k < 12; k++) {
    bits.push({ x: e.x, y: e.y, vx: (Math.random() - 0.5) * 340, vy: (Math.random() - 0.5) * 340,
                t: 0, life: 0.35, c: THUNDER_TONES[(Math.random() * 3) | 0] });
  }
}

function bossRestMul() { return (boss && boss.phase === 'rest') ? 2 : 1; }
function thunderLand(D) {
  const T = SWORDS.rai.thunder;
  player.dash = null;
  player.invul = Math.max(player.invul, D.landInvul != null ? D.landInvul : T.landInvul);
  
  if (D.tier >= 3) {
    const near = enemies.map((e, i) => ({ e, i, d: Math.hypot(e.x - player.x, e.y - player.y) }))
      .filter(o => o.d < T.chainR).sort((a, b) => a.d - b.d).slice(0, T.chainN);
    const dmg = D.chainDmg != null ? D.chainDmg : 0;
    let zap = false;
    for (const o of near.sort((a, b) => b.i - a.i)) {
      bolts.push({ x0: player.x, y0: player.y, x1: o.e.x, y1: o.e.y, t: 0, life: 0.30, seed: Math.random() * 100, step: swStep('rai') });
      
      let d = dmg;
      if (o.e.kind === 'dasher' && T.dasherMul) { d *= T.dasherMul; zap = true; zapFx(o.e); }
      damageEnemy(o.i, d, player.x, player.y, false, 'thunder');
    }
    if (boss && Math.hypot(boss.x - player.x, boss.y - player.y) < T.chainR + boss.r) {
      bolts.push({ x0: player.x, y0: player.y, x1: boss.x, y1: boss.y, t: 0, life: 0.30, seed: Math.random() * 100, step: swStep('rai') });
      
      const rm = bossRestMul();
      if (rm > 1) { zapFx(boss); zap = true; }
      damageBoss(dmg * rm, player.x, player.y, 'thunder');
    }
    
    if (zap) { SFX.shatter(); flash = Math.max(flash, 0.22); }
  }
}



function thunderWidth() {
  const T = player.sword.thunder; if (!T) return 0;
  return Array.isArray(T.width) ? T.width[Math.min(T.width.length - 1, swStep('rai'))] : T.width;
}
function thunderReady() {
  return state === 'play' && !paused && !player.dash && !!player.sword.thunder
      && player.thunderT >= player.sword.thunder.every;        
}
function thunderFire(tx, ty) {
  if (!thunderReady()) return false;
  const T = player.sword.thunder, WD = thunderWidth();
  let x1 = Math.max(20, Math.min(W - 20, tx)), y1 = Math.max(FLOOR_TOP(), Math.min(CONFIG.BAR_Y - 22, ty));
  
  const cl = clipRockLine(player.x, player.y, x1, y1, CONFIG.PLAYER_R);
  x1 = cl.x; y1 = cl.y;
  if (Math.hypot(x1 - player.x, y1 - player.y) < T.minDist) return false;
  player.thunderT = 0;
  const tier = swTier('rai');
  const dur = T.travel[Math.min(2, Math.max(0, tier - 1))];
  const a = Math.atan2(y1 - player.y, x1 - player.x);
  player.faceX = Math.cos(a); player.faceY = Math.sin(a);
  const pt = { x: x1, y: y1 };
  const D = { x0: player.x, y0: player.y, x1, y1, t: 0, dur: Math.max(0.001, dur), tier,
              landInvul: T.landInvul,
              chainDmg: swDmg(player.sword) * player.dmgMul * techMul('rai') * T.chainMul };
  
  const dmg = swDmg(player.sword) * player.dmgMul * techMul('rai');   
  const stunT = swLv('rai') >= T.stunLv ? CONFIG.STUN_T : 0;   
  let zap = false;
  for (let i = enemies.length - 1; i >= 0; i--) if (onLine(enemies[i].x, enemies[i].y, enemies[i].r, D.x0, D.y0, pt, WD)
        && !rockBetween(D.x0, D.y0, enemies[i].x, enemies[i].y)) {                 
    const e = enemies[i];
    if (stunT > 0) e.stun = Math.max(e.stun, stunT);
    
    let d = dmg;
    if (e.kind === 'dasher' && T.dasherMul) { d *= T.dasherMul; zap = true; zapFx(e); }
    damageEnemy(i, d, D.x0, D.y0, false, 'thunder');
  }
  if (boss && onLine(boss.x, boss.y, boss.r, D.x0, D.y0, pt, WD)) {
    
    const rm = bossRestMul();
    if (rm > 1) { zapFx(boss); zap = true; }
    damageBoss(dmg * rm, D.x0, D.y0, 'thunder');
  }
  
  if (zap) { SFX.shatter(); freeze = Math.max(freeze, 0.12); }
  
  for (let g = 0; g <= 6; g++) {
    const u = g / 6;
    ghosts.push({ x: D.x0 + (x1 - D.x0) * u, y: D.y0 + (y1 - D.y0) * u, t: -u * 0.05, life: 0.55 });
  }
  
  bolts.push({ x0:D.x0, y0:D.y0, x1:D.x1, y1:D.y1, t:0, life: 0.38 + tier * 0.06, seed: Math.random() * 100, step: swStep('rai') });
  flash = Math.max(flash, 0.30);
  freeze = Math.max(freeze, 0.10);
  SFX.superbeam ? SFX.superbeam() : SFX.beam ? SFX.beam() : SFX.kill(3);
  dragging = false; target = null; tapHint = null;
  if (tapTaught < CONFIG.TAP_TEACH) { tapTaught++; saveTaught(); }
  if (dur <= 0.001) { player.x = D.x1; player.y = D.y1; thunderLand(D); }
  else { player.dash = D; player.invul = Math.max(player.invul, dur + 0.05); }
  return true;
}

let floorTopExtra = 0;                 
const FLOOR_TOP = () => CONFIG.TOP + 16 + floorTopExtra;
const BAND_TOP  = () => Math.round((CONFIG.TOP + 16) / PATCH_CELL) * PATCH_CELL;  

const BAND_CLEAR = 12;
const BAND_H    = 64;                          
const BAND_BOT  = () => BAND_TOP() + BAND_H;   
const dmgTaken = () => {
  const early = CONFIG.EARLY_DMG_START + (1 - CONFIG.EARLY_DMG_START) * Math.min(1, (floorNo - 1) / CONFIG.EARLY_DMG_FLOORS);
  return early * Math.pow(1 + CONFIG.DMG_PER_CHAPTER, chapter - 1);
};

function update(dt) {
  if (freeze > 0) return;          
  if (state !== 'play') return;
  runTime += dt;

  
  
  const sp = CONFIG.SPEED * player.speedMul * (onPatch(player.x, player.y, 'water') ? CONFIG.SLOW_MUL : 1);
  let mx = 0, my = 0;
  if (clearBeat) target = null;   
  if (target) {
    const dx = target.x - player.x, dy = target.y - player.y, d = Math.hypot(dx, dy);
    if (d > 1) { mx = dx / d; my = dy / d; }
  } else {
    if (keys['arrowleft'] || keys['a']) mx -= 1;
    if (keys['arrowright']|| keys['d']) mx += 1;
    if (keys['arrowup']   || keys['w']) my -= 1;
    if (keys['arrowdown'] || keys['s']) my += 1;
    const d = Math.hypot(mx, my); if (d > 0) { mx /= d; my /= d; }
  }
  if (mx || my) { player.faceX = mx; player.faceY = my; }
  
  moveBlocked(player, player.x + mx * sp * dt, player.y + my * sp * dt, CONFIG.PLAYER_R, dt);
  player.x = Math.max(20, Math.min(W - 20, player.x));
  player.y = Math.max(FLOOR_TOP(), Math.min(CONFIG.BAR_Y - 22, player.y));
  pushOutRock(player, CONFIG.PLAYER_R);   
  
  if (graceT > 0) player.y = Math.max(CONFIG.BAR_Y - 16 - CONFIG.START_ZONE_H, player.y);
  player.lunge = Math.max(0, player.lunge - dt * 60);

  
  player.venom = Math.max(0, player.venom - dt);
  player.inVenom = graceT <= 0 && !player.dash && onPatch(player.x, player.y, 'poison');
  if (player.inVenom) {
    player.venomT -= dt;
    if (player.venomT <= 0) {
      player.venomT = CONFIG.FLOOR_POISON_TICK;
      
      player.hp -= player.maxHp * CONFIG.FLOOR_POISON_PCT * (1 - Math.min(0.7, player.guardAdd));
      player.venom = 0.30;
      SFX.venom();
      
      for (let k = 0; k < 4; k++) {
        const ang = -Math.PI / 2 + (Math.random() - 0.5) * 1.5, sp = 30 + Math.random() * 55;
        bits.push({ x: player.x + (Math.random() - 0.5) * 14, y: player.y + 6,
                    vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp, t: 0, life: 0.5,
                    c: k % 2 ? '#ffb0ff' : '#ffffff' });   
      }
      checkDown();
      if (state !== 'play') return;
    }
  } else {
    player.venomT = 0;
  }

  
  if (graceT <= 0) {
    player.atkT -= dt;
    if (player.atkT <= 0 && !player.dash && !clearBeat) { player.atkT = player.sword.interval * player.atkMul; swing(); }
  }

  
  if (player.dash) {
    const D = player.dash;
    D.t += dt;
    const k = Math.min(1, D.t / D.dur);
    player.x = D.x0 + (D.x1 - D.x0) * k; player.y = D.y0 + (D.y1 - D.y0) * k;
    player.invul = Math.max(player.invul, 0.1);
    if (k >= 1) thunderLand(D);
    return;
  }

  
  if (player.sword.thunder) { if (graceT <= 0) player.thunderT = Math.min(player.sword.thunder.every, player.thunderT + dt); }
  else player.thunderT = 0;
  
  if (thunderReady() && tapTaught < CONFIG.TAP_TEACH) {
    const H = CONFIG.TAP_HINT, width = thunderWidth();
    tapHintT -= dt;
    if (!tapHint) { const L = bestLine(null, width); tapHint = { x: L.pt.x, y: L.pt.y, ang: L.ang, cuts: L.cuts, tx: L.pt.x, ty: L.pt.y, held: 0 }; tapHintT = H.every; }
    else {
      tapHint.held += dt;
      
      const cur = lineEnd(tapHint.ang, null); tapHint.tx = cur.x; tapHint.ty = cur.y; tapHint.cuts = lineCuts(cur, width);
      if (tapHintT <= 0) {
        tapHintT = H.every;
        const L = bestLine(null, width);
        if (tapHint.held >= H.hold && L.cuts > tapHint.cuts) { tapHint.ang = L.ang; tapHint.cuts = L.cuts; tapHint.tx = L.pt.x; tapHint.ty = L.pt.y; tapHint.held = 0; }
      }
      const k = Math.min(1, H.ease * dt);
      tapHint.x += (tapHint.tx - tapHint.x) * k; tapHint.y += (tapHint.ty - tapHint.y) * k;
    }
  } else tapHint = null;

  
  if (player.sword.thrust && graceT <= 0) {
    const R = player.sword.thrust;
    player.thrustT += dt;
    if (player.thrustT >= R.every) {
      const len = player.sword.whip.len * R.lenMul[swStep('kune')];
      const L = bestLine(len, R.width);
      if (L.pt && L.cuts >= 1) {
        player.thrustT = 0;
        const tier = swTier('kune');
        const a = Math.atan2(L.pt.y - player.y, L.pt.x - player.x);
        player.faceX = Math.cos(a); player.faceY = Math.sin(a);
        player.lunge = 9; player.lx = Math.cos(a); player.ly = Math.sin(a);
        const dmg = swDmg(player.sword) * player.dmgMul * techMul('kune');   
        const poi = swLv('kune') >= R.poisonLv;   
        let broke = false;
        for (let i = enemies.length - 1; i >= 0; i--) if (onLine(enemies[i].x, enemies[i].y, enemies[i].r, player.x, player.y, L.pt, R.width)
              && !rockBetween(player.x, player.y, enemies[i].x, enemies[i].y)) {   
          const e = enemies[i];
          if (poi) applyPoison(e);
          let d = dmg;
          if (e.kind === 'kasa' && R.kasaMul) {
            
            d *= R.kasaMul; broke = true;
            rings.push({ x: e.x, y: e.y, r: 30, t: 0, life: 0.28, tele: false, white: true });
            for (let k = 0; k < 12; k++) bits.push({ x: e.x, y: e.y, vx: (Math.random() - 0.5) * 320, vy: (Math.random() - 0.5) * 320, t: 0, life: 0.35, c: '#ffe066' });
          }
          damageEnemy(i, d, player.x, player.y, false, 'thrust');
        }
        if (broke) { SFX.shatter(); freeze = Math.max(freeze, 0.10); flash = Math.max(flash, 0.25); }
        if (boss && onLine(boss.x, boss.y, boss.r, player.x, player.y, L.pt, R.width)
            && !rockBetween(player.x, player.y, boss.x, boss.y)) {                 
          
          damageBoss(dmg, player.x, player.y, 'thrust');
        }
        
        slashes.push({ x: player.x, y: player.y, a0: a, t: 0, hitSet: new Set(),
          whip: { len, sweep: 0, curl: 0, life: 0.30, grow: 0.30, wobA: 0, wobF: 0, wobS: 0, thick: 5 },
          len, dmg: 0, color: WHIP_COLOR, side: 1, straight: true });
        freeze = Math.max(freeze, 0.06); flash = Math.max(flash, 0.12);
        SFX.swing();
      }
    }
  } else player.thrustT = 0;

  
  if (player.sword.flame && graceT <= 0) {
    const F = player.sword.flame;
    if (player.flameOn > 0) {
      player.flameOn -= dt;
      
      if (player.flameOn <= 0 && swStep('katana') >= 1) enbu();
    }
    else {
      player.flameT += dt;
      if (player.flameT >= F.every) {
        const near = enemies.some(e => Math.hypot(e.x - player.x, e.y - player.y) < swReach(player.sword) * 1.5)
                  || (boss && Math.hypot(boss.x - player.x, boss.y - player.y) < swReach(player.sword) * 1.5 + boss.r);
        if (near) {
          player.flameT = 0; player.flameOn = F.dur[Math.min(3, swTier('katana'))];
          
          for (let k = 0; k < 28; k++) {
            const ang = Math.random() * Math.PI * 2, sp = 120 + Math.random() * 260;
            bits.push({ x:player.x, y:player.y, vx:Math.cos(ang)*sp, vy:Math.sin(ang)*sp - 60, t:0, life:0.35 + Math.random() * 0.3, c: k % 3 ? F.color : '#ffe066' });
          }
          rings.push({ x:player.x, y:player.y, r:30, t:0,     life:0.28, tele:false, fire:true });
          rings.push({ x:player.x, y:player.y, r:56, t:-0.06, life:0.40, tele:false, fire:true });
          bursts.push({ x:player.x, y:player.y, t:0, life:0.30, a:Math.PI / 4, c:F.color });
          freeze = Math.max(freeze, 0.08); flash = Math.max(flash, 0.22); zoom = Math.min(0.10, zoom + 0.08);
          SFX.open();
        }
      }
    }
  } else { player.flameT = 0; player.flameOn = 0; }

  
  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    if (e.slow > 0) e.slow -= dt;
    
    if (onPatch(e.x, e.y, 'poison')) {
      e.venomT = (e.venomT || 0) - dt;
      if (e.venomT <= 0) {
        e.venomT = CONFIG.FLOOR_POISON_TICK;
        bits.push({ x:e.x + (Math.random()-0.5)*10, y:e.y - 6, vx:(Math.random()-0.5)*30, vy:-40 - Math.random()*30, t:0, life:0.40, c:'#ffb0ff' });
        damageEnemy(i, e.maxHp * CONFIG.FLOOR_POISON_PCT, e.x, e.y + 1, true);
        if (!enemies[i] || enemies[i] !== e) continue;   
      }
    } else e.venomT = 0;
    if (e.poison <= 0) continue;
    e.poison -= dt; e.poisonTick -= dt;
    if (e.poisonTick <= 0) {
      e.poisonTick = CONFIG.POISON_TICK;
      bits.push({ x:e.x + (Math.random()-0.5)*10, y:e.y - 6, vx:(Math.random()-0.5)*30, vy:-40 - Math.random()*30, t:0, life:0.40, c:'#b46bff' });
      damageEnemy(i, e.poisonDmg, e.x, e.y + 1, true);
    }
  }
  

  
  {
    const O = CONFIG.ONI;
    const reds = enemies.filter(e => e.kind === 'oni');
    if (reds.length === 0 || graceT > 0) { oniSlamPhase = null; oniSlamT = O.slamEvery; oniSlamPt = 0; }
    else if (oniSlamPhase === 'tele') {
      oniSlamPt += dt;
      if (oniSlamPt >= O.slamTele) {
        oniSlamPhase = null; oniSlamT = O.slamEvery; oniSlamPt = 0;
        let hitPlayer = false;
        for (const e of reds) {
          
          rings.push({ x:e.x, y:e.y, r:O.slamR, t:0, life:0.26, tele:false, slamHit:true });
          for (let k = 0; k < 8; k++) { const a = k / 8 * Math.PI * 2;
            bits.push({ x:e.x + Math.cos(a) * O.slamR * 0.5, y:e.y + Math.sin(a) * O.slamR * 0.5,
                        vx:Math.cos(a) * 150, vy:Math.sin(a) * 150 - 30, t:0, life:0.34, c: k % 2 ? '#ffe066' : '#c9553d' }); }
          if (Math.hypot(player.x - e.x, player.y - e.y) < O.slamR) hitPlayer = true;   
        }
        
        if (hitPlayer) hurt(O.slamDmg);
        shake = Math.max(shake, 8);
        SFX.hit();
      }
    } else {
      oniSlamT -= dt;
      if (oniSlamT <= 0) { oniSlamPhase = 'tele'; oniSlamPt = 0; SFX.tele(); }
    }
  }

  
  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    if (e.burn <= 0) continue;
    e.burn -= dt; e.burnTick -= dt;
    if (e.burnTick <= 0) {
      e.burnTick = player.sword.flame ? player.sword.flame.burnTick : 0.4;
      bits.push({ x:e.x + (Math.random()-0.5)*10, y:e.y - 6, vx:(Math.random()-0.5)*40, vy:-60 - Math.random()*40, t:0, life:0.35, c:'#e2200a' });
      damageEnemy(i, e.burnDmg, e.x, e.y + 1, true);
    }
  }

  
  for (let i = bombs.length - 1; i >= 0; i--) {
    const bo = bombs[i];
    bo.t += dt; bo.spin += dt * 9;
    const K = CONFIG.BOSS_KASA;
    if (bo.t < 0) continue;
    if (bo.t < bo.fly) {
      const u = bo.t / bo.fly;
      bo.x = bo.x0 + (bo.tx - bo.x0) * u;
      bo.y = bo.y0 + (bo.ty - bo.y0) * u - Math.sin(u * Math.PI) * 46;      
      if (!bo.landed && bo.t >= bo.fly - bo.tele) { bo.landed = true; rings.push({ x: bo.tx, y: bo.ty, r: K.bombR, t: 0, life: bo.tele, tele: true }); }
    } else {
      rings.push({ x: bo.tx, y: bo.ty, r: K.bombR, t: 0, life: 0.34, tele: false });
      rings.push({ x: bo.tx, y: bo.ty, r: K.bombR * 1.4, t: 0, life: 0.44, tele: false });
      for (let k = 0; k < 16; k++) { const ang = Math.random() * Math.PI * 2, sp = 90 + Math.random() * 240;
        bits.push({ x: bo.tx, y: bo.ty, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp, t: 0, life: 0.4, c: k % 2 ? '#ff8a3d' : '#ffe066' }); }
      if (Math.hypot(player.x - bo.tx, player.y - bo.ty) < K.bombR) hurt(K.bombDmg);
      shake = Math.max(shake, 8); SFX.fire();
      bombs.splice(i, 1);
    }
  }

  
  if (player.sword.burst && graceT <= 0) {
    const B = player.sword.burst;
    player.burstT += dt;
    if (player.burstT >= B.every) {
      player.burstT = 0;
      const tier = swTier('hikari');
      const n = B.n[Math.min(B.n.length - 1, swStep('hikari'))];
      const dmg = swDmg(player.sword) * player.dmgMul * B.dmgMul * tierRamp('hikari');
      
      let tx = null, ty = null, bd = 1e9;
      for (const e of enemies) { const d2 = Math.hypot(e.x - player.x, e.y - player.y); if (d2 < bd) { bd = d2; tx = e.x; ty = e.y; } }
      if (tx === null && boss) { tx = boss.x; ty = boss.y; }
      const c0 = tx === null ? -Math.PI / 2 : Math.atan2(ty - player.y, tx - player.x);
      const SPREAD = Math.PI;                       
      const base = c0 - SPREAD / 2;
      for (let k = 0; k < n; k++) {
        const a = base + (n === 1 ? SPREAD / 2 : k / (n - 1) * SPREAD);
        shots.push({ x: player.x + Math.cos(a) * 14, y: player.y + Math.sin(a) * 14,
                     vx: Math.cos(a) * B.speed, vy: Math.sin(a) * B.speed, t: 0, life: B.life, r: B.r, dmg, trail: [] });
      }
      rings.push({ x: player.x, y: player.y, r: 34, t: 0, life: 0.30, tele: false, beam: true });
      freeze = Math.max(freeze, 0.06); flash = Math.max(flash, 0.18);
      SFX.beam();
    }
  } else player.burstT = 0;
  
  
  for (let i = shots.length - 1; i >= 0; i--) {
    const sh = shots[i];
    sh.t += dt; sh.x += sh.vx * dt; sh.y += sh.vy * dt;
    sh.trail.push({ x: sh.x, y: sh.y }); if (sh.trail.length > 5) sh.trail.shift();
    if (sh.t > sh.life || sh.x < -12 || sh.x > W + 12 || sh.y < FLOOR_TOP() - 12 || sh.y > CONFIG.BAR_Y + 12) { shots.splice(i, 1); continue; }
    if (onRock(sh.x, sh.y)) { rockPuff(sh.x, sh.y, SWORDS.hikari.color); shots.splice(i, 1); continue; }   
    let gone = false;
    for (let j = enemies.length - 1; j >= 0 && !gone; j--) {
      const e = enemies[j];
      if (Math.hypot(e.x - sh.x, e.y - sh.y) < e.r + sh.r) {
        
        
        if (e.kind === 'kasa' && onKasaShield(e, sh.x, sh.y)) {
          
          kasaBlock(e, sh.x, sh.y);
          damageEnemy(j, sh.dmg * CONFIG.KASA.shotCut, sh.x, sh.y, true);
        } else {
          if (player.sword.slowLv && swLv('hikari') >= player.sword.slowLv) e.slow = CONFIG.SLOW_T;
          damageEnemy(j, sh.dmg, sh.x, sh.y, false, 'beam');
        }
        shots.splice(i, 1); gone = true;   
      }
    }
    if (!gone && boss && Math.hypot(boss.x - sh.x, boss.y - sh.y) < boss.r + sh.r) { damageBoss(sh.dmg, sh.x, sh.y, 'beam'); shots.splice(i, 1); }
  }

  
  if (player.shuriken > 0 && graceT <= 0) {
    player.shuriT -= dt;
    if (player.shuriT <= 0) {
      player.shuriT = 3.0;
      let bd = 260, tgt = null;
      for (const e of enemies) { const d = Math.hypot(e.x - player.x, e.y - player.y); if (d < bd) { bd = d; tgt = e; } }
      if (!tgt && boss) tgt = boss;
      if (tgt) {
        const base = Math.atan2(tgt.y - player.y, tgt.x - player.x);
        for (let k = 0; k < player.shuriken; k++) {
          const a = base + (k - (player.shuriken - 1) / 2) * 0.22;
          stars.push({ x:player.x, y:player.y, vx:Math.cos(a)*260, vy:Math.sin(a)*260, t:0, spin:Math.random()*6, pierce:0, hitSet:new Set() });
        }
        SFX.shoot ? SFX.shoot() : SFX.hit();
      }
    }
  }
  for (let i = stars.length - 1; i >= 0; i--) {
    const st = stars[i];
    st.t += dt; st.spin += dt * 22;
    st.x += st.vx * dt; st.y += st.vy * dt;
    if (st.t > 1.4 || st.x < -14 || st.x > W + 14 || st.y < -14 || st.y > H + 14) { stars.splice(i, 1); continue; }
    if (onRock(st.x, st.y)) { rockPuff(st.x, st.y, SHURI_COL[1]); stars.splice(i, 1); continue; }          
    let gone = false;
    for (let j = enemies.length - 1; j >= 0 && !gone; j--) {
      const e = enemies[j];
      if (st.hitSet.has(e)) continue;
      if (Math.hypot(e.x - st.x, e.y - st.y) < e.r + 7) {
        st.hitSet.add(e);
        damageEnemy(j, 24 * player.dmgMul, st.x, st.y);
        if (--st.pierce < 0) { stars.splice(i, 1); gone = true; }
      }
    }
    if (!gone && boss && !st.hitSet.has(boss) && Math.hypot(boss.x - st.x, boss.y - st.y) < boss.r + 7) {
      st.hitSet.add(boss); damageBoss(24 * player.dmgMul, st.x, st.y);
      if (--st.pierce < 0) stars.splice(i, 1);
    }
  }

  
  
  const orbN = player.orbs + ((player.sword.flame && player.sword.flame.auraLv
      && swLv('katana') >= player.sword.flame.auraLv && player.flameOn > 0) ? player.sword.flame.auraN : 0);
  if (orbN > 0 && graceT <= 0) {
    let near = null, nd = 170;
    for (const e of enemies) { const d = Math.hypot(e.x - player.x, e.y - player.y); if (d < nd) { nd = d; near = e; } }
    if (boss) { const d = Math.hypot(boss.x - player.x, boss.y - player.y); if (d < nd) { nd = d; near = boss; } }
    
    if (near) {
      const target = Math.atan2(near.y - player.y, near.x - player.x);
      let diff = target - player.orbT; while (diff > Math.PI) diff -= Math.PI * 2; while (diff < -Math.PI) diff += Math.PI * 2;
      player.orbT += diff * Math.min(1, dt * 8);
    }
    player.orbT += dt * 1.8;
    for (let k = 0; k < orbN; k++) {
      const a = orbAngle(player.orbT, k, orbN);   
      const ox = player.x + Math.cos(a) * 46, oy = player.y + Math.sin(a) * 46;
      for (let i = enemies.length - 1; i >= 0; i--) {
        const e = enemies[i];
        if (Math.hypot(e.x - ox, e.y - oy) < e.r + 6 && (e.orbCd || 0) <= 0 && !rockBetween(ox, oy, e.x, e.y)) {
          
          e.orbCd = 0.45;
          const F = SWORDS.katana.flame, onibiDmg = swDmg(SWORDS.katana);
          e.burn = F.burnT; e.burnDmg = onibiDmg * player.dmgMul * F.burnMul; e.burnTick = 0.1;
          damageEnemy(i, 0, ox, oy);
        }
      }
      
    }
  }

  
  for (let i = slashes.length - 1; i >= 0; i--) {
    const s = slashes[i];
    s.t += dt;
    if (s.whip) {
      if (s.t > s.whip.life) { slashes.splice(i, 1); continue; }
      s.x = player.x; s.y = player.y;          
      s.pts = whipPoints(s);
      hitCheck(s);
      continue;
    }
    if (s.beam) {
      const P = s.proj || { speed:300, life:1.2, turn:0, wob:0 };
      
      if (P.turn > 0) {
        let bd = 1e9, tgt = null;
        const SEEK = P.seek || 130;
        for (const e of enemies) { const d = Math.hypot(e.x - s.x, e.y - s.y); if (d < bd && d < SEEK) { bd = d; tgt = e; } }
        if (!tgt && boss && Math.hypot(boss.x - s.x, boss.y - s.y) < SEEK) tgt = boss;
        if (tgt) {
          let da = Math.atan2(tgt.y - s.y, tgt.x - s.x) - s.a;
          while (da > Math.PI) da -= Math.PI * 2; while (da < -Math.PI) da += Math.PI * 2;
          const K = P.turn * dt;
          s.a += Math.max(-K, Math.min(K, da));
        }
      }
      s.wobT += dt;
      const wob = P.wob ? Math.sin(s.wobT * 18) * P.wob : 0;   
      s.x += (Math.cos(s.a) * P.speed + Math.cos(s.a + Math.PI / 2) * wob * 12) * dt;
      s.y += (Math.sin(s.a) * P.speed + Math.sin(s.a + Math.PI / 2) * wob * 12) * dt;
      s.trail.push({ x:s.x, y:s.y }); if (s.trail.length > 9) s.trail.shift();
      if (s.t > P.life * player.reachMul || s.x < -20 || s.x > W + 20 || s.y < -20 || s.y > H + 20) { slashes.splice(i, 1); continue; }
    } else if (s.t > 0.16) { slashes.splice(i, 1); continue; }
    hitCheck(s);
  }

  
  
  let dashingN = 0;
  for (const e of enemies) if (e.kind === 'dasher' && (e.phase === 'ready' || e.phase === 'dash')) dashingN++;
  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    e.t += dt; e.flash = Math.max(0, e.flash - dt * 4);
    if (e.orbCd > 0) e.orbCd -= dt;
    const dx = player.x - e.x, dy = player.y - e.y, d = Math.hypot(dx, dy) || 1;

    if (graceT > 0) {
      
      e.x += Math.sin(e.t * 2.3) * 8 * dt;
    } else if (e.stun > 0) {
      
      e.stun -= dt;
    } else if (e.kind === 'oni') {
      
      if (oniSlamPhase !== 'tele') rockMove(e, dx / d * eSpeed(e) * dt, dy / d * eSpeed(e) * dt, dt);
    } else if (e.kind === 'kasa') {
      
      if (e.stagger > 0) {
        e.stagger -= dt;
        e.flash = Math.max(e.flash, 0.05);
      } else {
        
        let gx = player.x, gy = player.y;   
        let ward = null, wd = 150;
        for (const o of enemies) {
          if (o === e || (o.kind !== 'tama' && o.kind !== 'dasher')) continue;
          const od = Math.hypot(o.x - e.x, o.y - e.y);
          if (od < wd) { wd = od; ward = o; }
        }
        if (ward) {
          const px2 = player.x - ward.x, py2 = player.y - ward.y, pd = Math.hypot(px2, py2) || 1;
          gx = ward.x + px2 / pd * 34;      
          gy = ward.y + py2 / pd * 34;
        }
        const mvx = gx - e.x, mvy = gy - e.y, mvd = Math.hypot(mvx, mvy) || 1;
        const want = Math.atan2(dy, dx);    
        let da = want - e.face;
        while (da > Math.PI) da -= Math.PI * 2; while (da < -Math.PI) da += Math.PI * 2;
        const K = CONFIG.KASA.turn * dt;
        e.face += Math.max(-K, Math.min(K, da));
        
        if (mvd > 6 || onAnyPatch(e.x, e.y)) {
          const v = patchAwareDir(e, mvx / mvd, mvy / mvd, dt);
          if (v.move) rockMove(e, v.x * eSpeed(e) * dt, v.y * eSpeed(e) * dt, dt);
        }
      }
    } else if (e.kind === 'dasher') {
      const D = CONFIG.DASHER;
      e.pt += dt;
      if (e.phase === 'walk') {
        rockMove(e, dx / d * eSpeed(e) * dt, dy / d * eSpeed(e) * dt, dt);
        
        if (d < D.range && dashingN < D.maxDash) { e.phase = 'ready'; e.pt = 0; e.flash = 0.1; dashingN++; }
      } else if (e.phase === 'ready') {
        e.flash = 0.2;                                     
        if (e.pt >= D.ready) { e.phase = 'dash'; e.pt = 0; e.dx = dx / d; e.dy = dy / d; SFX.fire(); }
      } else if (e.phase === 'dash') {
        
        const sl = (e.slow > 0 || onPatch(e.x, e.y, 'water')) ? CONFIG.SLOW_MUL : 1;
        
        if (moveBlocked(e, e.x + e.dx * D.dash * sl * dt, e.y + e.dy * D.dash * sl * dt, e.r)) {
          e.phase = 'rest'; e.pt = 0; e.flash = 0.3;
          hits.push({ x: e.x, y: e.y, t: 0 });
          for (let k = 0; k < 6; k++) bits.push({ x:e.x, y:e.y, vx:(Math.random()-0.5)*260, vy:(Math.random()-0.5)*260, t:0, life:0.28, c:'#8a5cf0' });
          SFX.hitBlock ? SFX.hitBlock() : SFX.hit();
        }
        if (e.pt >= D.dashT) { e.phase = 'rest'; e.pt = 0; }
      } else { 
        if (e.pt >= D.rest) { e.phase = 'walk'; e.pt = 0; }
      }
    } else { 
      const want = CONFIG.TAMA.keep;
      const k = d < want ? -1 : (d > want + CONFIG.TAMA.band ? 1 : 0);
      
      if (k !== 0 || onAnyPatch(e.x, e.y)) {
        const kk = k !== 0 ? k : 1;                
        const v = patchAwareDir(e, dx / d * kk, dy / d * kk, dt);
        if (v.move) rockMove(e, v.x * eSpeed(e) * dt, v.y * eSpeed(e) * dt, dt);
      }
      e.fireT -= dt;
      if (e.fireT <= 0) {
        e.fireT = CONFIG.FIRE.interval;
        fires.push({ x:e.x, y:e.y, vx: dx/d*CONFIG.FIRE.speed, vy: dy/d*CONFIG.FIRE.speed });
        SFX.fire();
      }
    }
    e.x += e.kb.x * dt; e.y += e.kb.y * dt;
    e.kb.x *= Math.pow(0.015, dt); e.kb.y *= Math.pow(0.015, dt);
    pushOutRock(e, e.r);                  
    e.x = Math.max(16, Math.min(W - 16, e.x));
    e.y = Math.max(FLOOR_TOP(), Math.min(CONFIG.BAR_Y - 16, e.y));
    pushOutRock(e, e.r);          

    if (d < e.r + 10) hurt(e.kind === 'dasher' && e.phase === 'dash' ? CONFIG.DASHER.dashDmg : e.touch);
  }

  
  for (let i = 0; i < enemies.length; i++) {
    for (let j = i + 1; j < enemies.length; j++) {
      const ea = enemies[i], eb = enemies[j];
      const ddx = eb.x - ea.x, ddy = eb.y - ea.y;
      const dd = Math.hypot(ddx, ddy);
      const minD = ea.r + eb.r + 6;
      if (dd < minD) {
        
        const ang = dd < 0.01 ? Math.random() * Math.PI * 2 : Math.atan2(ddy, ddx);
        const push = (minD - dd) / 2, nx = Math.cos(ang), ny = Math.sin(ang);
        ea.x -= nx * push; ea.y -= ny * push;
        eb.x += nx * push; eb.y += ny * push;
      }
    }
  }
  for (const e of enemies) {
    e.x = Math.max(16, Math.min(W - 16, e.x));
    e.y = Math.max(FLOOR_TOP(), Math.min(CONFIG.BAR_Y - 16, e.y));
  }
  
  if (graceT > 0) {
    const zTop = CONFIG.BAR_Y - 16 - CONFIG.START_ZONE_H;
    for (const e of enemies) {
      if (e._zoneJ === undefined) e._zoneJ = 6 + Math.random() * 22;
      const limit = zTop - e.r - e._zoneJ;
      if (e.y > limit) e.y = limit;
    }
  }

  
  if (boss) updateBoss(dt);

  
  for (let i = fires.length - 1; i >= 0; i--) {
    const f = fires[i];
    f.x += f.vx * dt; f.y += f.vy * dt;
    
    if (f.x < -12 || f.x > W + 12 || f.y < FLOOR_TOP() - 12 || f.y > CONFIG.BAR_Y + 12) { fires.splice(i, 1); continue; }
    
    if (onRock(f.x, f.y)) { rockPuff(f.x, f.y, '#dfe6f2'); fires.splice(i, 1); continue; }
    if (Math.hypot(f.x - player.x, f.y - player.y) < 12) { hurt(CONFIG.FIRE.dmg); fires.splice(i, 1); }
  }

  
  if (alive() === 0 && state === 'play') {
    
    if (!clearBeat) {
      const C = CONFIG.CLEAR;
      clearBeat = true; clearT = C.dur;
      zoomAt = lastKill ? { x: lastKill.x, y: lastKill.y } : { x: player.x, y: player.y };
      freeze = Math.max(freeze, C.freeze); slow = Math.max(slow, C.slow); flash = Math.max(flash, 0.35);
      rings.push({ x: zoomAt.x, y: zoomAt.y, r: 70, t: 0, life: 0.6, tele: false, white: true });
      fires.length = 0;                 
      dragging = false; target = null;
    } else if (clearT <= 0) {
    clearBeat = false; zoomAt = null;
    const wasBoss = isBossFloor(floorNo);
    gate.open = true;
    floorNo++;
    if (!introSeen && floorNo > 1) saveIntroSeen();
    if (floorNo - 1 > best) best = floorNo - 1;
    
    if (floorNo - 1 >= CONFIG.FINAL_FLOOR) {
      bestChapter = Math.max(bestChapter, chapterOf(floorNo - 1));
      cleared = true; saveBest();
      state = 'clear'; overT = 0; dragging = false; target = null;
      flash = 1.0; slow = Math.max(slow, 1.2); SFX.climb();
      stopBgm();
      return;
    }
    if (wasBoss) { bestChapter = Math.max(bestChapter, chapterOf(floorNo)); chapterFlash = 1; SFX.climb(); rollChapterCards(); }
    else { SFX.open(); rollCards(); }
    saveBest();
    
    if (!cards.length) { buildFloor(); dragging = false; target = null; return; }
    state = 'choose'; dragging = false; target = null;
    return;
    }
  }

  player.invul = Math.max(0, player.invul - dt);
  player.flash = Math.max(0, player.flash - dt);
  streakT = Math.max(0, streakT - dt);
  if (streakT <= 0) killStreak = 0;
  if (hintT > 0) hintT -= dt;
  if (graceT > 0) {
    const before = Math.ceil(graceT);
    graceT -= dt;
    const after = Math.ceil(graceT);
    if (after !== before) { if (after > 0) SFX.count(); else { SFX.go(); goT = 0.7; } }   
  }
  for (let i = hits.length - 1; i >= 0; i--) { hits[i].t += dt; if (hits[i].t > 0.4) hits.splice(i, 1); }
  for (let i = rings.length - 1; i >= 0; i--) { rings[i].t += dt; if (rings[i].t > rings[i].life) rings.splice(i, 1); }
  for (let i = bursts.length - 1; i >= 0; i--) { bursts[i].t += dt; if (bursts[i].t > bursts[i].life) bursts.splice(i, 1); }
  for (let i = bolts.length - 1; i >= 0; i--) { bolts[i].t += dt; if (bolts[i].t > bolts[i].life) bolts.splice(i, 1); }
  for (let i = ghosts.length - 1; i >= 0; i--) { ghosts[i].t += dt; if (ghosts[i].t > ghosts[i].life) ghosts.splice(i, 1); }
  for (let i = bits.length - 1; i >= 0; i--) {
    const b = bits[i];
    b.t += dt; b.x += b.vx * dt; b.y += b.vy * dt; b.vx *= Math.pow(0.06, dt); b.vy *= Math.pow(0.06, dt);
    if (b.t > b.life) bits.splice(i, 1);
  }
}


function updateBoss(dt) {
  const B = CONFIG.BOSS, b = boss;
  if (graceT > 0 || bossIn > 0.85) return;
  b.t += dt; b.pt += dt; b.flash = Math.max(0, b.flash - dt * 4);
  if (b.orbCd > 0) b.orbCd -= dt;
  const dx = player.x - b.x, dy = player.y - b.y, d = Math.hypot(dx, dy) || 1;
  if (!b.angry && b.hp < b.maxHp * 0.5) { b.angry = true; b.flash = 0.4; SFX.open(); }
  const has = k => b.kinds.indexOf(k) >= 0;

  
  if (has('kasa')) kasaFace(dt, b, dx, dy, d);

  
  const busy = has('dasher') ? dasherAct(dt, b, dx, dy, d) : false;
  if (!busy) bossMove(dt, b, dx, dy, d);

  
  if (has('oni'))  oniAct(dt, b, dx, dy, d);
  if (has('kasa')) kasaAct(dt, b, dx, dy, d);
  if (has('tama')) tamaAct(dt, b, dx, dy, d);

  
  if (b.angry) {
    b.sumT -= dt;
    if (b.sumT <= 0 && enemies.length < 6) {
      b.sumT = B.summonEvery * b.atkSlow;
      const hpMul = 1 + (chapter - 1) * CONFIG.HP_PER_CHAPTER;
      for (let k = 0; k < 2; k++) {
        const kind = b.kinds[(b.sumN = (b.sumN || 0) + 1) % b.kinds.length];
        enemies.push(mkEnemy(kind, Math.max(30, Math.min(W - 30, b.x + (k ? 40 : -40))), b.y + 30, hpMul, 1));
      }
    }
  }
  
  
  const tm = (b.kinds.indexOf('dasher') >= 0 && CONFIG.BOSS_DASHER.touchMul) ? CONFIG.BOSS_DASHER.touchMul : 1;
  bossTail(b, (b.phase === 'dash' ? B.touch * 1.5 : B.touch) * tm, dt);
}


function bossMove(dt, b, dx, dy, d) {
  const main = b.kinds[0];
  if (main === 'tama') {
    const T = CONFIG.BOSS_TAMA;
    const away = d < T.keep ? -1 : (d > T.keep + 60 ? 1 : 0);
    b.x += dx / d * T.speed * b.spdMul * away * dt;
    b.y += dy / d * T.speed * b.spdMul * away * dt;
    b.x += Math.cos(b.t * 1.3) * 26 * dt; b.y += Math.sin(b.t * 1.7) * 20 * dt;
    return;
  }
  if (main === 'kasa') {
    const K = CONFIG.BOSS_KASA;
    if (b.stagger > 0) return;                                  
    const perp = b.face + Math.PI / 2, strafe = Math.sin(b.t * K.strafeFreq) * K.strafeSpeed;
    b.x += dx / d * K.speed * b.spdMul * dt + Math.cos(perp) * strafe * dt;
    b.y += dy / d * K.speed * b.spdMul * dt + Math.sin(perp) * strafe * dt;
    return;
  }
  const sp = (main === 'dasher' ? CONFIG.BOSS_DASHER.speed : CONFIG.BOSS.speed) * b.spdMul;
  b.x += dx / d * sp * dt; b.y += dy / d * sp * dt;
}


function oniAct(dt, b, dx, dy, d) {
  const B = CONFIG.BOSS;
  b.slamT -= dt;
  
  if (b.slamPhase !== 'tele' && b.slamT <= 0) {
    b.slamPhase = 'tele'; b.slamPt = 0;
    SFX.tele ? SFX.tele() : SFX.open();          
  }
  if (b.slamPhase === 'tele') {
    b.slamPt += dt;
    if (b.slamPt >= B.slamTele) {
      b.slamPhase = null; b.slamT = B.slamEvery * b.atkSlow;
      
      rings.push({ x:b.x, y:b.y, r:B.slamR, t:0, life:0.30, tele:false, slamHit:true });
      rings.push({ x:b.x, y:b.y, r:B.slamR, t:0, life:0.44, tele:false, slamHit:true });
      for (let k = 0; k < 16; k++) { const a = k / 16 * Math.PI * 2;
        bits.push({ x:b.x + Math.cos(a) * B.slamR * 0.6, y:b.y + Math.sin(a) * B.slamR * 0.6,
                    vx:Math.cos(a) * 200, vy:Math.sin(a) * 200 - 40, t:0, life:0.45, c: k % 2 ? '#ffe066' : '#c9553d' }); }
      if (Math.hypot(player.x - b.x, player.y - b.y) < B.slamR) hurt(B.slamDmg);   
      shake = Math.max(shake, 14); zoom = Math.min(0.12, zoom + 0.08);
      SFX.boss ? SFX.boss() : SFX.fire();
    }
  }
}


function drawSlamTele(cx, cy, r, k) {          
  const pulse = 0.5 + Math.sin(Date.now() / 90) * 0.5;
  
  ctx.fillStyle = `rgba(220,60,40,${0.10 + k * 0.22})`;
  ctx.beginPath(); ctx.arc(cx, cy, r * k, 0, Math.PI * 2); ctx.fill();
  
  ctx.strokeStyle = `rgba(255,80,60,${0.55 + pulse * 0.45})`;
  ctx.lineWidth = 3 + pulse * 2;
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.stroke();
  
  ctx.setLineDash([10, 12]); ctx.lineDashOffset = -Date.now() / 26;
  ctx.strokeStyle = `rgba(255,224,102,${0.5 + k * 0.5})`; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(cx, cy, r - 7, 0, Math.PI * 2); ctx.stroke();
  ctx.setLineDash([]);
  
  if (k > 0.82) { ctx.strokeStyle = `rgba(255,255,255,${(k - 0.82) / 0.18 * 0.9})`; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.stroke(); }
}


function kasaFace(dt, b, dx, dy, d) {
  const K = CONFIG.BOSS_KASA;
  const want = Math.atan2(dy, dx);
  if (b.stagger > 0) { b.stagger -= dt; return; }
  let da = want - b.face; while (da > Math.PI) da -= Math.PI*2; while (da < -Math.PI) da += Math.PI*2;
  b.face += Math.max(-K.turn * dt, Math.min(K.turn * dt, da));
}

function kasaAct(dt, b, dx, dy, d) {
  const K = CONFIG.BOSS_KASA;
  b.bombT -= dt;
  if (b.bombT <= 0 && b.stagger <= 0) {
    b.bombT = K.bombEvery * b.atkSlow;
    for (let k = 0; k < K.bombN; k++) {
      const tx = Math.max(28, Math.min(W - 28, player.x + (Math.random() - 0.5) * K.bombScatter));
      const ty = Math.max(FLOOR_TOP() + 20, Math.min(CONFIG.BAR_Y - 26, player.y + (Math.random() - 0.5) * K.bombScatter));
      bombs.push({ x0: b.x, y0: b.y, x: b.x, y: b.y, tx, ty, t: -k * 0.18, fly: K.bombFly, tele: K.bombTele, spin: Math.random() * 6 });
    }
    SFX.fire();
  }
  const want = Math.atan2(dy, dx);
  let da2 = want - b.face; while (da2 > Math.PI) da2 -= Math.PI * 2; while (da2 < -Math.PI) da2 += Math.PI * 2;
  if (b.stagger <= 0 && Math.abs(da2) > K.behindAngle) b.backT = (b.backT || 0) + dt; else b.backT = 0;
  if (b.backT >= K.behindPunishT * b.atkSlow) {
    b.backT = 0;
    bombs.push({ x0: b.x, y0: b.y, x: b.x, y: b.y, tx: player.x, ty: player.y, t: 0, fly: K.bombFly * 0.7, tele: K.bombTele * 0.7, spin: Math.random() * 6 });
    SFX.fire();
  }
}


function dasherAct(dt, b, dx, dy, d) {
  const P = CONFIG.BOSS_DASHER;
  if (b.phase === 'walk' || !b.phase) {
    b.dashT -= dt;
    if (b.dashT <= 0) { b.phase = 'ready'; b.pt = 0; b.rep = P.repeat; return true; }
    return false;                                   
  }
  if (b.phase === 'ready') {
    b.flash = 0.2;
    if (b.pt >= P.ready) { b.phase = 'dash'; b.pt = 0; b.dx = dx / d; b.dy = dy / d;
      zoom = Math.min(0.14, zoom + 0.10); SFX.fire(); }
  } else if (b.phase === 'dash') {
    
    
    if (moveBlocked(b, b.x + b.dx * P.dash * b.dashMul * dt, b.y + b.dy * P.dash * b.dashMul * dt, b.r * 0.7)) {
      b.pt = 0; b.rep = 0; b.phase = 'rest'; b.flash = 0.4;
      shake = Math.max(shake, 8); freeze = Math.max(freeze, 0.06);
      for (let k = 0; k < 14; k++) bits.push({ x:b.x, y:b.y, vx:(Math.random()-0.5)*340, vy:(Math.random()-0.5)*340, t:0, life:0.4, c:'#8a5cf0' });
      SFX.hitBlock ? SFX.hitBlock() : SFX.hit();
      return true;
    }
    if (b.pt >= P.dashT) { b.pt = 0; b.rep--; b.phase = b.rep > 0 ? 'between' : 'rest'; }
  } else if (b.phase === 'between') {
    if (b.pt >= P.between) { b.phase = 'ready'; b.pt = 0; }
  } else if (b.phase === 'rest') {                  
    if (b.pt >= P.rest) { b.phase = 'walk'; b.pt = 0; b.dashT = P.dashEvery * b.atkSlow; }
  }
  return true;
}


function tamaAct(dt, b, dx, dy, d) {
  const T = CONFIG.BOSS_TAMA;
  b.shotT -= dt; b.ringT -= dt;
  if (b.shotT <= 0) {
    b.shotT = T.shotEvery * b.atkSlow;
    const base = Math.atan2(dy, dx);
    for (let k = 0; k < T.shotN; k++) {
      const a = base + (k - (T.shotN - 1) / 2) * (T.shotSpread / T.shotN);
      fires.push({ x: b.x, y: b.y, vx: Math.cos(a) * CONFIG.FIRE.speed, vy: Math.sin(a) * CONFIG.FIRE.speed });
    }
    SFX.fire();
  }
  if (b.ringT <= 0) {
    b.ringT = T.ringEvery * b.atkSlow;
    for (let k = 0; k < T.ringN; k++) {
      const a = k / T.ringN * Math.PI * 2 + b.t;
      fires.push({ x: b.x, y: b.y, vx: Math.cos(a) * CONFIG.FIRE.speed * 0.85, vy: Math.sin(a) * CONFIG.FIRE.speed * 0.85 });
    }
    rings.push({ x:b.x, y:b.y, r:70, t:0, life:0.4, tele:false, white:true });
    SFX.fire();
  }
}

function bossTail(b, dmg, dt) {
  b.x += b.kb.x * dt; b.y += b.kb.y * dt;
  pushOutRock(b, b.r * 0.7);              
  b.kb.x *= Math.pow(0.015, dt); b.kb.y *= Math.pow(0.015, dt);
  b.x = Math.max(34, Math.min(W - 34, b.x));
  b.y = Math.max(FLOOR_TOP() + 20, Math.min(CONFIG.BAR_Y - 40, b.y));
  if (Math.hypot(player.x - b.x, player.y - b.y) < b.r + 10) hurt(dmg);
}



function aimAngle() {
  let bd = Infinity, t = null;
  for (const e of enemies) {
    const d = Math.hypot(e.x - player.x, e.y - player.y);
    if (d < bd) { bd = d; t = e; }
  }
  if (boss) {
    const d = Math.hypot(boss.x - player.x, boss.y - player.y);
    if (d < bd) { bd = d; t = boss; }
  }
  if (t) return Math.atan2(t.y - player.y, t.x - player.x);
  return Math.atan2(player.faceY, player.faceX);
}


function enbu() {
  const s = SWORDS.katana, F = s.flame;

  slashes.push({ x: player.x, y: player.y, a: Math.atan2(player.faceY, player.faceX), t: 0, hitSet: new Set(),
                 reach, arc: Math.PI * 2, dmg, beam: false, color: F.color, heavy: true, flame: swStep('katana') >= 3,
                 sparkle: swLv('katana') >= F.spreadLv });
  rings.push({ x: player.x, y: player.y, r: reach, t: 0, life: 0.34, tele: false, fire: true });
  for (let k = 0; k < 18; k++) {
    const ang = Math.random() * Math.PI * 2, sp = 100 + Math.random() * 220;

  }

}

function swing() {

    });

      dmg: swDmg(s) * player.dmgMul * (fl ? 1 + (s.flame.dmgMul - 1) * tierRamp('katana') : 1), beam: false,
      color: fl ? s.flame.color : s.color, color2: fl ? null : s.color2, heavy: !!s.rare || fl, flame: fl,

      beam: true, proj: P, pierce: P.pierce, color: s.color,

    });
  }
  SFX.swing();
}


function whipPoints(s) {
  const Wp = s.whip;
  const k = Math.min(1, s.t / Wp.life);
  const grow = Math.min(1, k / Wp.grow);
  const ease = k * k * (3 - 2 * k);
  const base = s.a0 + Wp.sweep * ease;
  const pts = [];
  
  const n = Math.max(28, Math.min(80, Math.round(s.len / 3)));
  for (let i = 0; i < n; i++) {
    const u = i / (n - 1);
    const r = s.len * grow * u;
    const wob = Math.sin(u * Wp.wobF - s.t * Wp.wobS) * Wp.wobA * u * s.side;
    const ang = base + Wp.curl * u * s.side + wob;
    pts.push({ x: s.x + Math.cos(ang) * r, y: s.y + Math.sin(ang) * r, u });
  }
  return pts;
}

function inArc(s, tx, ty, tr) {
  if (s.whip) {
    const th = s.whip.thick + tr;
    for (const q of s.pts || []) if (Math.hypot(tx - q.x, ty - q.y) < th) return true;
    return false;
  }
  const dx = tx - s.x, dy = ty - s.y, d = Math.hypot(dx, dy);
  if (d > s.reach + tr) return false;
  if (s.beam) return true;
  let da = Math.atan2(dy, dx) - s.a;
  while (da > Math.PI) da -= Math.PI * 2; while (da < -Math.PI) da += Math.PI * 2;
  return Math.abs(da) <= s.arc / 2;
}

function hitCheck(s) {
  if (s.dmg <= 0) return;      
  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    if (s.hitSet.has(e)) continue;
    if (!inArc(s, e.x, e.y, e.r)) continue;
    if (rockBetween(s.x, s.y, e.x, e.y)) continue;      
    s.hitSet.add(e);
    if (s.beam && s.pierce != null) { s.pierce--; if (s.pierce < 0) { const ix = slashes.indexOf(s); if (ix >= 0) slashes.splice(ix, 1); return; } }
    let dmg = s.dmg;
    
    if (e.kind === 'kasa') {
      if (onKasaShield(e, s.x, s.y) && e.stagger <= 0) { kasaBlock(e, s.x, s.y); continue; }
      if (e.stagger > 0) dmg *= CONFIG.KASA.staggerMul;   
    }
    if (e.kind === 'dasher' && e.phase === 'rest') dmg *= 2;   
    
    if (s.flame && swStep('katana') >= 3) { const F = player.sword.flame; e.burn = F.burnT; e.burnDmg = swDmg(player.sword) * player.dmgMul * F.burnMul; e.burnTick = 0.1; }
    damageEnemy(i, dmg, s.x, s.y, false, 'sword');
  }
  if (boss && !s.hitSet.has(boss) && inArc(s, boss.x, boss.y, boss.r) && !rockBetween(s.x, s.y, boss.x, boss.y)) {
    s.hitSet.add(boss);
    
    const bm = 1;
    
    damageBoss(s.dmg * bossRestMul() * bm, s.x, s.y, 'sword');
  }
}


function onKasaShield(e, fx, fy) {
  const from = Math.atan2(fy - e.y, fx - e.x);
  let da = from - e.face;
  while (da > Math.PI) da -= Math.PI * 2; while (da < -Math.PI) da += Math.PI * 2;
  return Math.abs(da) <= CONFIG.KASA.shield * Math.PI / 180;
}
function kasaBlock(e, fx, fy) {
  const from = Math.atan2(fy - e.y, fx - e.x);
  if (e.stagger <= 0) { e.stagger = CONFIG.KASA.stagger; e.kb.x = Math.cos(from) * -160; e.kb.y = Math.sin(from) * -160; }
  for (let k = 0; k < 8; k++) bits.push({ x:e.x + Math.cos(from) * 14, y:e.y + Math.sin(from) * 14, vx:(Math.random()-0.5)*260, vy:(Math.random()-0.5)*260, t:0, life:0.3, c:'#f2e6d2' });
  SFX.hitBlock(); e.flash = 0.2; freeze = Math.max(freeze, 0.05);
}

function damageEnemy(i, dmg, fx, fy, soft, src) {
  const e = enemies[i];
  const dx = e.x - fx, dy = e.y - fy, nd = Math.hypot(dx, dy) || 1;
  let weak = false;
  if (src && BOSS_WEAK[e.kind] && player.sword.id === BOSS_WEAK[e.kind]) { dmg *= CONFIG.ENEMY_WEAK_MUL; weak = true; }
  e.hp -= dmg;
  const col = BIT_COLOR[e.kind] || '#ffffff';
  if (!soft) {
    e.flash = 0.3;
    e.kb.x = dx / nd * CONFIG.KNOCKBACK; e.kb.y = dy / nd * CONFIG.KNOCKBACK;
    hits.push({ x: e.x, y: e.y, t: 0 });
    for (let k = 0; k < 4; k++) {
      const ang = Math.atan2(dy, dx) + (Math.random() - 0.5) * 1.6;
      bits.push({ x:e.x, y:e.y, vx:Math.cos(ang)*(120+Math.random()*140), vy:Math.sin(ang)*(120+Math.random()*140), t:0, life:0.28, c:col });
    }
    freeze = Math.max(freeze, 0.025);
    if (weak) {
      SFX.hitWeak();
      for (let k = 0; k < 4; k++) bits.push({ x:e.x, y:e.y, vx:(Math.random()-0.5)*220, vy:(Math.random()-0.5)*220, t:0, life:0.22, c:'#ffe066' });
    } else SFX.hit();
  }
  if (e.hp <= 0) {
    
    if (e.burn > 0 && player.sword.flame && swLv('katana') >= player.sword.flame.spreadLv) {
      for (const o of enemies) if (o !== e && o.burn <= 0 && Math.hypot(o.x - e.x, o.y - e.y) < player.sword.flame.spreadR) {
        o.burn = player.sword.flame.burnT; o.burnDmg = e.burnDmg; o.burnTick = 0.15;
      }
    }
    enemies.splice(i, 1);
    lastKill = { x: e.x, y: e.y };
    runKills++;
    if (runKillsBy[e.kind] != null) runKillsBy[e.kind]++;   
    killStreak++; streakT = 1.6;
    SFX.kill();
    freeze = Math.max(freeze, 0.05);
    flash = Math.max(flash, 0.15);
    
    rings.push({ x:e.x, y:e.y, r:22, t:0,     life:0.20, tele:false, white:true });
    rings.push({ x:e.x, y:e.y, r:40, t:-0.05, life:0.34, tele:false, white:true });
    bursts.push({ x:e.x, y:e.y, t:0, life:0.26, a:Math.random() * Math.PI, c:col });
    for (let k = 0; k < 26; k++) {
      const ang = Math.random() * Math.PI * 2, sp = 100 + Math.random() * 320;
      bits.push({ x:e.x, y:e.y, vx:Math.cos(ang)*sp, vy:Math.sin(ang)*sp, t:0, life:0.30 + Math.random() * 0.40, c: k % 3 === 0 ? '#ffffff' : col });
    }
    
  }
}



function damageBoss(dmg, fx, fy, src, soft) {
  const b = boss;
  const dx = b.x - fx, dy = b.y - fy, nd = Math.hypot(dx, dy) || 1;
  
  
  let mul = 1;
  
  if (src && b.weaks && b.weaks.indexOf(player.sword.id) >= 0) { dmg *= CONFIG.BOSS_WEAK_MUL; mul *= CONFIG.BOSS_WEAK_MUL; }
  
  if (!soft && b.kinds && b.kinds.indexOf('kasa') >= 0) {
    const from = Math.atan2(fy - b.y, fx - b.x);
    let da = from - b.face; while (da > Math.PI) da -= Math.PI*2; while (da < -Math.PI) da += Math.PI*2;
    const onShield = Math.abs(da) <= CONFIG.BOSS_KASA.shield * Math.PI / 180;
    if (onShield) {
      if (src === 'thrust') {
        dmg *= 2; mul *= 2; b.stagger = 1.2; b.flash = 0.4;
        rings.push({ x:b.x, y:b.y, r: b.r + 16, t:0, life:0.35, tele:false, white:true });
        for (let k = 0; k < 18; k++) bits.push({ x:b.x, y:b.y, vx:(Math.random()-0.5)*380, vy:(Math.random()-0.5)*380, t:0, life:0.4, c:'#ffe066' });
        SFX.shatter(); freeze = Math.max(freeze, 0.12); flash = Math.max(flash, 0.3);
      } else {
        dmg *= CONFIG.BOSS_KASA.frontCut; mul *= CONFIG.BOSS_KASA.frontCut;
        for (let k = 0; k < 3; k++) bits.push({ x:fx, y:fy, vx:(Math.random()-0.5)*180, vy:(Math.random()-0.5)*180, t:0, life:0.2, c:'#f2e6d2' });
      }
    }
  }
  b.hp -= dmg;
  if (!soft) {
    b.flash = 0.25;
    b.kb.x = dx / nd * 30; b.kb.y = dy / nd * 30;
    hits.push({ x: b.x + (Math.random()-0.5)*30, y: b.y + (Math.random()-0.5)*30, t: 0 });
    for (let k = 0; k < 5; k++) bits.push({ x:b.x, y:b.y, vx:(Math.random()-0.5)*260, vy:(Math.random()-0.5)*260, t:0, life:0.3, c:BIT_COLOR.boss });
    freeze = Math.max(freeze, mul > 1 ? 0.05 : 0.03);
    
    if (mul > 1.001) SFX.hitWeak(); else if (mul < 0.999) SFX.hitBlock(); else SFX.hit();
  }
  if (b.hp <= 0) {
    for (let k = 0; k < 40; k++) { const ang = Math.random()*Math.PI*2, sp = 120+Math.random()*300;
      bits.push({ x:b.x, y:b.y, vx:Math.cos(ang)*sp, vy:Math.sin(ang)*sp, t:0, life:0.8, c:k%2?BIT_COLOR.boss:'#ffe066' }); }
    boss = null; enemies.length = 0; fires.length = 0; lastKill = { x: b.x, y: b.y };
    
    freeze = 0.30; flash = 0.7; slow = 1.1; zoom = 0.30; shake = 20; bossDie = 1.2;
    for (let k = 0; k < 5; k++) rings.push({ x:b.x, y:b.y, r: 40 + k * 30, t: -k * 0.08, life: 0.5, tele:false, white:true });
  }
}

function hurt(amount) {
  if (player.invul > 0) return;
  const cut = Math.min(0.7, player.guardAdd);
  player.hp -= amount * dmgTaken() * (1 - cut);
  player.invul = CONFIG.INVUL;
  player.flash = 0.18;
  shake = Math.max(shake, 10);   
  SFX.damage();
  checkDown();
}

function checkDown() {
  if (player.hp <= 0) {
    if (player.lives > 0) {          
      
      player.lives--; player.hp = player.maxHp; player.invul = 2.2;
      flash = 0.8; freeze = Math.max(freeze, 0.35); slow = Math.max(slow, 0.8); shake = 0;
      oneUp = 1.6; zoomAt = { x: player.x, y: player.y }; zoom = Math.max(zoom, 0.22);
      for (let k = 0; k < 3; k++) rings.push({ x:player.x, y:player.y, r: 26 + k * 26, t: -k * 0.10, life: 0.55, tele:false, white:true });
      for (let k = 0; k < 30; k++) { const ang = Math.random() * Math.PI * 2, sp = 90 + Math.random() * 240;
        bits.push({ x:player.x, y:player.y, vx:Math.cos(ang)*sp, vy:Math.sin(ang)*sp, t:0, life:0.6, c: k % 2 ? '#5bd06a' : '#ffffff' }); }
      SFX.oneup ? SFX.oneup() : SFX.heal();
      return;
    }
    player.hp = 0;
    state = 'over'; overT = 0; freeze = 0;
    saveBest();
    SFX.over();
    stopBgm();
    
    deathFloor = floorNo;
    try { localStorage.setItem('zan_death_floor', String(deathFloor)); } catch (e) {}
  }
}


function pips(id) { return took[id] || 0; }
function rollFrom(list) {
  const pool = [];
  
  let forced = null, forced2 = null;
  if (list === CARDS && nextUnlockId()) forced = CARDS.find(c => c.id === 'unlock');
  
  if (list === CARDS && player.hp <= player.maxHp * CONFIG.HEAL_FORCE) {
    const h = CARDS.find(c => c.id === 'heal');
    if (h && (!h.ok || h.ok(player))) forced2 = h;
  }
  for (const c of list) {
    if (c.ok && !c.ok(player)) continue;
    if (c.max != null && pips(c.id) >= c.max) continue;
    for (let i = 0; i < (c.weight || 1); i++) pool.push(c);
  }
  const out = [], used = new Set(), ids = new Set(pool.map(x => x.id));
  if (forced2) { out.push(forced2); used.add(forced2.id); }        
  if (forced) { out.push(forced); used.add(forced.id); }
  let guard = 0;
  while (out.length < 3 && used.size < ids.size + (forced ? 1 : 0) && guard++ < 300) {
    const c = pool[(Math.random() * pool.length) | 0];
    if (used.has(c.id)) continue;
    used.add(c.id); out.push(c);
  }
  return out;
}
function rollCards() { chooseKind = 'normal'; chooseT = 0; cards = rollFrom(CARDS); }
function rollChapterCards() { chooseKind = 'chapter'; chooseT = 0; cards = rollFrom(CHAPTER_CARDS); }
function cardRect(i) { return { x: 30, y: 200 + i * 118, w: W - 60, h: 100 }; }
function pickCard(p) {
  for (let i = 0; i < cards.length; i++) if (inRect(p, cardRect(i))) { choose(cards[i]); return; }
}
function choose(c) {
  if (!c) return;
  c.apply(player);
  took[c.id] = (took[c.id] || 0) + 1;
  player.lv++;
  SFX.pick();
  buildFloor();
  state = 'play';
}


function startRect() { return { x: W / 2 - 70, y: 300, w: 140, h: 78 }; }

function versionRect() { return { x: W - 64, y: H - 30, w: 58, h: 26 }; }
function resetYesRect() { return { x: W / 2 - 76, y: 372, w: 92, h: 40 }; }
function resetNoRect()  { return { x: W / 2 + 26, y: 372, w: 50, h: 40 }; }


function drawSurround(vw, vh) {
  if (offX < 0.5 && offY < 0.5) return;
  
  ctx.save();
  const px = offX, py = offY, pw = W * scale, ph = H * scale;

  const g = ctx.createLinearGradient(0, 0, 0, vh);
  g.addColorStop(0, '#12131c'); g.addColorStop(1, '#06070b');
  ctx.fillStyle = g; ctx.fillRect(0, 0, vw, vh);

  
  const glow = ctx.createRadialGradient(vw / 2, vh / 2, ph * 0.18, vw / 2, vh / 2, Math.max(vw, vh) * 0.62);
  glow.addColorStop(0, 'rgba(255,150,60,0.10)'); glow.addColorStop(1, 'rgba(255,150,60,0)');
  ctx.fillStyle = glow; ctx.fillRect(0, 0, vw, vh);

  
  const t = Date.now() / 1000;
  for (let i = 0; i < 22; i++) {
    const seed = i * 137.5;
    const x = ((Math.sin(seed) * 0.5 + 0.5) * 0.96 + 0.02) * vw;
    if (x > px - 6 && x < px + pw + 6) continue;   
    const speed = 10 + (i % 5) * 3.2;
    const y = vh - ((t * speed + seed * 41) % (vh + 60));
    const tw = 0.25 + 0.5 * (0.5 + 0.5 * Math.sin(t * 2.6 + seed));
    const sz = (i % 3 === 0) ? 3 : 2;
    ctx.fillStyle = `rgba(255,${172 + (i * 23) % 60},70,${(tw * 0.34).toFixed(2)})`;
    ctx.fillRect(Math.round(x) - sz / 2, Math.round(y) - sz / 2, sz, sz);
  }

  const vig = ctx.createRadialGradient(vw / 2, vh / 2, Math.min(vw, vh) * 0.3, vw / 2, vh / 2, Math.max(vw, vh) * 0.72);
  vig.addColorStop(0, 'rgba(0,0,0,0)'); vig.addColorStop(1, 'rgba(0,0,0,0.5)');
  ctx.fillStyle = vig; ctx.fillRect(0, 0, vw, vh);

  
  if (offX >= 0.5) {
    const e = Math.max(10, pw * 0.05);
    let L = ctx.createLinearGradient(px - e, 0, px, 0);
    L.addColorStop(0, 'rgba(0,0,0,0)'); L.addColorStop(1, 'rgba(0,0,0,0.45)');
    ctx.fillStyle = L; ctx.fillRect(px - e, 0, e, vh);
    let R = ctx.createLinearGradient(px + pw + e, 0, px + pw, 0);
    R.addColorStop(0, 'rgba(0,0,0,0)'); R.addColorStop(1, 'rgba(0,0,0,0.45)');
    ctx.fillStyle = R; ctx.fillRect(px + pw, 0, e, vh);
    ctx.fillStyle = 'rgba(255,170,90,0.13)';
    ctx.fillRect(px - 1, py, 1, ph); ctx.fillRect(px + pw, py, 1, ph);
  }
  if (offY >= 0.5) {
    ctx.fillStyle = 'rgba(255,170,90,0.13)';
    ctx.fillRect(px, py - 1, pw, 1); ctx.fillRect(px, py + ph, pw, 1);
  }
  ctx.restore();
}

function draw() {
  const vw = window.innerWidth, vh = window.innerHeight;
  ctx.fillStyle = '#07080d';
  ctx.fillRect(0, 0, vw, vh);
  drawSurround(vw, vh);

  ctx.save();
  const sx = shake ? (Math.random() - 0.5) * shake : 0;
  const sy = shake ? (Math.random() - 0.5) * shake : 0;
  ctx.translate(offX + sx, offY + sy);
  ctx.scale(scale, scale);
  ctx.beginPath(); ctx.rect(0, 0, W, H); ctx.clip();
  
  ctx.save();
  if (zoom > 0.001 && state !== 'title') {
    const cx = zoomAt ? zoomAt.x : player ? player.x : W / 2, cy = zoomAt ? zoomAt.y : player ? player.y : H / 2;
    ctx.translate(cx, cy); ctx.scale(1 + zoom, 1 + zoom); ctx.translate(-cx, -cy);
  }

  if (state === 'title') { ctx.restore(); drawTitle(); drawButtons(); ctx.restore(); return; }

  drawWorld();
  ctx.restore();
  drawHUD();
  drawSwordBar();
  drawButtons();
  if (flash > 0) { ctx.fillStyle = `rgba(255,255,255,${flash * 0.9})`; ctx.fillRect(0, 0, W, H); }
  if (bossDie > 0) {

    }

const PATCH_PATTERNS = {

function layoutPatches(kind, patName, rnd, blocked) {
  const P = PATCH_PATTERNS[patName] || PATCH_PATTERNS.few;
  const want = P.n[0] + (rnd() * (P.n[1] - P.n[0] + 1) | 0);
  
  const bandY = FLOOR_TOP() + 60 + rnd() * Math.max(0, SAFE_TOP() - 60 - (FLOOR_TOP() + 60));
  const dgDown = rnd() < 0.5;

  let cy = FLOOR_TOP() + 50 + rnd() * Math.max(0, SAFE_TOP() - 50 - (FLOOR_TOP() + 50));
  let placed = 0, guard = 0;
  while (placed < want && guard++ < 400) {
    const rx = P.r[0] + rnd() * (P.r[1] - P.r[0]), ry = rx * (0.60 + rnd() * 0.30);
    let x, y;
    if (P.spread === 'chain') {              
      x = cx; y = cy;
    } else if (P.spread === 'band') {        
      x = 10 + (placed + rnd() * 0.6) * (W - 20) / want;
      y = bandY + (rnd() - 0.5) * 46;
    } else if (P.spread === 'diag') {        
      const u = (placed + rnd() * 0.6) / want;
      x = 20 + u * (W - 40);
      y = (dgDown ? FLOOR_TOP() + 50 : SAFE_TOP() - 50) + (dgDown ? 1 : -1) * u * (SAFE_TOP() - FLOOR_TOP() - 100);
    } else {                                  
      x = 24 + rnd() * (W - 48);
      y = FLOOR_TOP() + ry + rnd() * Math.max(0, SAFE_TOP() - ry - (FLOOR_TOP() + ry));
    }
    const p2 = {
      kind,
      x: Math.max(16, Math.min(W - 16, x)),
      
      y: Math.max(FLOOR_TOP() + ry + 4, Math.min(SAFE_TOP() - ry, y)),
      rx, ry,
    };
    if (p2.y + p2.ry > SAFE_TOP() || p2.y - p2.ry < FLOOR_TOP()) { continue; }
    if (blocked && blocked.size) {
      let hit = false;
      for (const k of patchCells(p2, new Map()).keys()) if (blocked.has(k)) { hit = true; break; }
      if (hit) continue;                      
    }
    floorPatches.push(p2);
    placed++;
    if (P.spread === 'chain') {               
      const a = rnd() * Math.PI * 2;
      cx = p2.x + Math.cos(a) * rx * 0.85;
      cy = p2.y + Math.sin(a) * ry * 0.85;
    }

}


let floorRocks = [];

function rockToCells(r, out) {
  const def = SPRITES[r.art]; if (!def) return out;
  const C = PATCH_CELL;
  for (let gy = 0; gy < def.px.length; gy++) {
    const row = def.px[gy];
    for (let gx = 0; gx < row.length; gx++) {
      if (row[gx] === '.') continue;
      out.set((r.x + gx * C) + ',' + (r.y + gy * C), 1);
    }
  }

}
function rockCellCount(art) {

  return n;
}

function onRock(x, y) { return floorCells.rock.has(cellKey(x, y)); }

function rockRadius(r) { return Math.max(5, r * 0.8); }

function overlapsRock(x, y, r0) {
  if (!floorCells.rock.size) return false;
  if (!isFinite(x) || !isFinite(y) || !isFinite(r0)) return false;
  const C = PATCH_CELL, r = Math.min(200, rockRadius(r0));
  const x0 = Math.floor((x - r) / C) * C, x1 = Math.floor((x + r) / C) * C;
  const y0 = Math.floor((y - r) / C) * C, y1 = Math.floor((y + r) / C) * C;
  for (let gx = x0; gx <= x1; gx += C)
    for (let gy = y0; gy <= y1; gy += C) {
      if (!floorCells.rock.has(gx + ',' + gy)) continue;
      const cx = Math.max(gx, Math.min(x, gx + C)), cy = Math.max(gy, Math.min(y, gy + C));
      const dx = x - cx, dy = y - cy;
      if (dx * dx + dy * dy < r * r) return true;
    }
  return false;
}
function hitsRock(x, y, r0) { return overlapsRock(x, y, r0); }

function pushOutRock(o, r0) {
  if (!floorCells.rock.size) return false;
  if (!isFinite(o.x) || !isFinite(o.y) || !isFinite(r0)) return false;   
  const C = PATCH_CELL, r = Math.min(200, rockRadius(r0));
  let hit = false;
  for (let pass = 0; pass < 2; pass++) {
    let px = 0, py = 0, n = 0;
    const x0 = Math.floor((o.x - r) / C) * C, x1 = Math.floor((o.x + r) / C) * C;
    const y0 = Math.floor((o.y - r) / C) * C, y1 = Math.floor((o.y + r) / C) * C;
    for (let gx = x0; gx <= x1; gx += C)
      for (let gy = y0; gy <= y1; gy += C) {
        if (!floorCells.rock.has(gx + ',' + gy)) continue;
        const cx = Math.max(gx, Math.min(o.x, gx + C)), cy = Math.max(gy, Math.min(o.y, gy + C));
        let dx = o.x - cx, dy = o.y - cy;
        let d = Math.hypot(dx, dy);
        if (d >= r) continue;
        if (d < 0.001) { dx = 0; dy = -1; d = 0.001; } else { dx /= d; dy /= d; }
        px += dx * (r - d + 0.5); py += dy * (r - d + 0.5); n++;
      }
    if (!n) break;
    hit = true;
    o.x += px / n; o.y += py / n;
  }
  return hit;
}

const SLIDE_TURNS = [0.55, 1.0, 1.45, 1.9];
function moveBlocked(o, nx, ny, r, dt) {
  if (!isFinite(nx) || !isFinite(ny)) return false;                      
  if (!floorCells.rock.size) { o.x = nx; o.y = ny; return false; }
  if (!overlapsRock(nx, ny, r)) { o.x = nx; o.y = ny; o._slideT = 0; return false; }
  const dx = nx - o.x, dy = ny - o.y, sp = Math.hypot(dx, dy);
  if (sp < 1e-6) { pushOutRock(o, r); return true; }
  const a = Math.atan2(dy, dx);
  if (o._slideT > 0) o._slideT -= (dt || 1 / 60); else o._slideDir = 0;
  const sides = o._slideDir ? [o._slideDir, -o._slideDir] : [1, -1];
  for (const sd of sides)
    for (const t of SLIDE_TURNS) {
      const ang = a + sd * t;
      const px2 = o.x + Math.cos(ang) * sp, py2 = o.y + Math.sin(ang) * sp;
      if (!overlapsRock(px2, py2, r)) {
        o.x = px2; o.y = py2; o._slideDir = sd; o._slideT = 0.35;
        return true;
      }
    }
  pushOutRock(o, r);
  return true;
}

function clipRockLine(x0, y0, x1, y1, r) {
  if (!floorCells.rock.size) return { x: x1, y: y1 };
  const dx = x1 - x0, dy = y1 - y0, len = Math.hypot(dx, dy);
  if (len < 1) return { x: x1, y: y1 };
  if (!isFinite(len)) return { x: x1, y: y1 };                            
  const step = PATCH_CELL / 2, n = Math.min(400, Math.ceil(len / step));
  let last = { x: x0, y: y0 };
  for (let i = 1; i <= n; i++) {
    const t = Math.min(1, i * step / len);
    const px2 = x0 + dx * t, py2 = y0 + dy * t;
    if (hitsRock(px2, py2, r || 6)) return last;
    last = { x: px2, y: py2 };
  }
  return { x: x1, y: y1 };
}

    } else {
      let x = -snap(24 + rnd() * 40);
      while (x < W) x += put(pick(), x);
    }
    for (const r of floorRocks) rockToCells(r, floorCells.rock);
    return;
  }
  const art = plan.art, def = SPRITES[art];
  const w = def.px[0].length * PATCH_CELL, h = def.px.length * PATCH_CELL;
  const per = rockCellCount(art);
  const want = Math.min(plan.n, Math.max(1, Math.floor(CONFIG.ROCK_MAX_CELLS / per)));
  const top0 = snap(FLOOR_TOP() + CONFIG.ROCK_GAP), bot0 = snap(SAFE_TOP() - h);
  const left0 = snap(CONFIG.ROCK_GAP), right0 = snap(W - CONFIG.ROCK_GAP - w);
  
  const cands = [];
  for (let y = top0; y <= bot0; y += PATCH_CELL * 2)
    for (let x = left0; x <= right0; x += PATCH_CELL * 2) cands.push({ x, y });
  const score = c => {
    if (plan.place === 'top')  return c.y;                                  
    if (plan.place === 'mid')  return Math.abs(c.x + w / 2 - W / 2) + Math.abs(c.y + h / 2 - (top0 + bot0 + h) / 2) * 0.6;
    return rnd();                                                            
  };
  if (plan.place === 'gate') {
    
    const gy = snap(top0 + (bot0 - top0) * (0.3 + rnd() * 0.4));
    const open = (rnd() * 5) | 0;
    for (let i = 0; i < 5 && floorRocks.length < want; i++) {
      if (i === open) continue;
      const x = Math.max(left0, Math.min(right0, snap(left0 + i * (right0 - left0) / 4)));
      if (rockFits(art, x, gy)) floorRocks.push({ art, x, y: gy });
    }
  } else {
    for (const c of cands) c._s = score(c) + (plan.place === 'free' ? 0 : rnd() * 24);
    cands.sort((a, b) => a._s - b._s);
    for (const c of cands) { if (floorRocks.length >= want) break; if (rockFits(art, c.x, c.y)) floorRocks.push({ art, x: c.x, y: c.y }); }
  }
  
  if (!floorRocks.length) {
    for (const c of cands) if (rockFits(art, c.x, c.y)) { floorRocks.push({ art, x: c.x, y: c.y }); break; }
  }
  for (const r of floorRocks) rockToCells(r, floorCells.rock);
}
